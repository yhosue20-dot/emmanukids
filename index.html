<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<title>EMMANUKIDS · Administración</title>
<style>
:root{
  --bg:#f6f4f8; --card:#fff; --linea:#eae7ee; --texto:#1c1720; --suave:#7c7488;
  --tinta:#d6206b; --tinta-bg:#fdf1f6; --ok:#047857; --ok-bg:#ecfdf5;
  --sol:#f59e0b; --sol-bg:#fffbeb; --cielo:#0ea5e9; --cielo-bg:#f0f9ff;
  --uva:#7c3aed; --uva-bg:#f5f3ff;
  --sombra:0 1px 2px rgba(28,23,32,.04), 0 8px 24px -12px rgba(28,23,32,.12);
  --sombra-alta:0 2px 4px rgba(28,23,32,.05), 0 16px 40px -16px rgba(28,23,32,.22);
}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--texto);font-size:15px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
input,select,textarea,button{font:inherit;font-size:16px}
.cifra{font-variant-numeric:tabular-nums}
header{background:linear-gradient(118deg,#2a1b33 0%,#4a1d45 52%,#7d1f4e 100%);
  color:#fff;padding:13px 16px;display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;z-index:20;padding-top:calc(13px + env(safe-area-inset-top))}
header b{letter-spacing:-.025em;font-size:16.5px}
header small{color:rgba(255,255,255,.62);display:block;font-size:11px;letter-spacing:.02em}
main{padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--linea);display:flex;overflow-x:auto;z-index:20;
  padding-bottom:env(safe-area-inset-bottom);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:72px;border:0;background:none;padding:9px 4px 8px;color:var(--suave);
  font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;transition:color .18s}
nav button span{font-size:17px;line-height:1;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
nav button.on{color:var(--tinta)}
nav button.on span{transform:translateY(-2px) scale(1.14)}
nav button.on::after{content:'';position:absolute;bottom:2px;width:16px;height:3px;border-radius:9px;
  background:var(--tinta)}
.card{background:var(--card);border:1px solid var(--linea);border-radius:18px;padding:15px;
  margin-bottom:12px;box-shadow:var(--sombra);animation:sube .32s ease both}
.card h3{margin:0 0 11px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--suave);
  display:flex;align-items:center;gap:7px}
.card h3::before{content:'';width:3px;height:13px;border-radius:9px;background:var(--tinta);flex:0 0 auto}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);
  font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;min-height:46px;border:1px solid #ded9e4;
  border-radius:12px;background:#fff;color:var(--texto);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tinta);box-shadow:0 0 0 3px var(--tinta-bg)}
button.b{border:0;border-radius:13px;min-height:48px;padding:0 16px;font-weight:700;width:100%;
  background:linear-gradient(135deg,#e82d78,#c0185c);color:#fff;
  box-shadow:0 2px 5px rgba(214,32,107,.24);transition:transform .13s,box-shadow .13s,filter .13s}
button.b:hover{filter:brightness(1.05)}
button.b:active{transform:translateY(1px) scale(.988);box-shadow:0 1px 2px rgba(214,32,107,.2)}
button.b:disabled{opacity:.4}
button.g{background:#fff;color:var(--texto);border:1px solid #ded9e4;box-shadow:none}
button.g:hover{background:#faf9fb;border-color:#cec7d6}
button.n{background:linear-gradient(135deg,#3a2b45,#1c1720);box-shadow:0 2px 5px rgba(28,23,32,.2)}
button.chico{min-height:38px;font-size:13px;width:auto;padding:0 12px}
.fila{display:flex;gap:8px;align-items:center}
.fila>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:13px 14px;
  box-shadow:var(--sombra);position:relative;overflow:hidden;animation:sube .34s ease both}
.kpi::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--tinta)}
.kpi:nth-child(2)::before{background:var(--cielo)}
.kpi:nth-child(3)::before{background:var(--ok)}
.kpi:nth-child(4)::before{background:var(--sol)}
.kpi:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4){animation-delay:.15s}
.kpi .et{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--suave)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f4f4f5}
.item:last-child{border:0}
.item .t{font-size:14px;font-weight:600}
.item .s{font-size:12px;color:var(--suave)}
.item .m{text-align:right;font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:999px;
  background:#f2eff5;color:var(--suave);letter-spacing:.01em}
.tag.rojo{background:var(--tinta-bg);color:var(--tinta)}
.tag.verde{background:var(--ok-bg);color:var(--ok)}
.aviso{padding:11px 13px;border-radius:13px;font-size:13.5px;margin-bottom:12px;
  animation:sube .3s ease both;border-left:3px solid currentColor}
.aviso.err{background:var(--tinta-bg);color:#8a0f44}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.vacio{text-align:center;color:var(--suave);font-size:13.5px;padding:22px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--suave);letter-spacing:.05em;
  padding:6px 4px;border-bottom:1px solid var(--linea)}
td{padding:7px 4px;border-bottom:1px solid #f4f4f5}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.prod{background:#fff;border:1px solid var(--linea);border-radius:15px;padding:11px;text-align:left;
  width:100%;min-height:auto;box-shadow:var(--sombra);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,border-color .15s}
.prod:hover{border-color:#e3b9cd;box-shadow:var(--sombra-alta);transform:translateY(-2px)}
.prod:active{transform:scale(.97)}
.prod.off{opacity:.4}
.punto{width:11px;height:11px;border-radius:99px;border:1px solid #d4d4d8;display:inline-block;vertical-align:-1px}
.swatch{display:block;border:1px solid var(--linea);border-radius:14px;overflow:hidden;
  background:var(--card);transition:border-color .15s,box-shadow .15s;cursor:pointer}
.swatch:focus-within{border-color:var(--tinta);box-shadow:0 0 0 3px var(--tinta-bg)}
.sw-cara{display:block;height:44px;border-bottom:1px solid rgba(0,0,0,.07)}
.sw-nom{display:block;font-size:10.5px;color:var(--suave);text-align:center;
  padding:5px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.swatch input{border:0!important;background:none!important;text-align:center;
  font-size:19px!important;font-weight:700;padding:0 2px 7px!important;min-height:auto!important;
  font-variant-numeric:tabular-nums}
.swatch input:focus{outline:none}
table.malla{font-size:13.5px}
table.malla th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--suave)}
table.malla td,table.malla th{padding:6px 8px;white-space:nowrap}
table.malla tr.pie td{border-top:2px solid var(--linea);font-weight:700;color:var(--texto)}
.celda{border:0;background:none;font:inherit;font-weight:700;color:var(--texto);
  padding:3px 7px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums}
.celda:hover{background:var(--tinta-bg);color:var(--tinta)}
td.c0{background:#fef2f2}
td.c0 .celda,td.c0 b{color:#dc2626}
td.cbajo{background:#fffbeb}
td.cbajo .celda,td.cbajo b{color:#b45309}
.barra{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));background:#fff;
  border-top:1px solid var(--linea);padding:13px 14px;z-index:19;max-height:52vh;overflow-y:auto;
  box-shadow:0 -10px 34px rgba(28,23,32,.13);border-radius:20px 20px 0 0;
  animation:sube .26s cubic-bezier(.34,1.3,.64,1) both}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.modal{animation:sube .2s ease both}
.modal>div{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:18px;
  max-height:88vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 44px rgba(28,23,32,.3)}
#recibo{display:none}
@media print{
  body>*{display:none!important}
  #recibo{display:block!important;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:0}
  #recibo hr{border:0;border-top:1px dashed #000}
  #recibo .hoja{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#000}
}
.hoja{padding:4px}
.hcab{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:10px}
.hquien{font-size:26px;font-weight:800;line-height:1.1}
.hsub{font-size:12px;color:#444;margin-top:3px}
.hfecha{font-size:11px;letter-spacing:.08em;line-height:1.3}
.hfecha b{font-size:17px;letter-spacing:0}
.hpago{margin-top:5px;border:2px solid #000;padding:2px 7px;font-size:12px;font-weight:800;
  display:inline-block}
.hnota{border:1px solid #000;padding:6px 9px;font-size:13px;margin-bottom:10px}
.hfalta{background:#000;color:#fff;padding:6px 9px;font-size:14px;margin-bottom:10px}
.htab{width:100%;border-collapse:collapse}
.htab td{border-bottom:1px solid #bbb;padding:9px 4px;vertical-align:middle}
.hchk{font-size:26px;width:34px;line-height:1}
.hcant{font-size:24px;font-weight:800;width:44px;text-align:center}
.hdet b{font-size:17px}
.hlin{font-size:11px;border:1px solid #000;border-radius:9px;padding:1px 6px;margin-left:6px}
.hcol{font-size:14px;margin-top:2px}
.hest{font-size:11px;text-align:right;white-space:nowrap;width:92px;color:#555}
.hest b{font-size:12px;border:2px solid #000;padding:2px 6px;color:#000}
.hpie{margin-top:14px;font-size:10.5px;color:#666;text-align:center}
</style>
</head>
<body>

<div id="login" style="display:none;position:fixed;inset:0;background:#18181b;
  align-items:center;justify-content:center;padding:24px;z-index:50"></div>

<div id="app" style="display:none">
  <header>
    <div><b>EMMANUKIDS</b><small id="hsub">Administración</small></div>
    <button class="b g chico" onclick="A.salir()">Salir · <span id="quien"></span></button>
  </header>
  <div id="msg" style="padding:14px 14px 0"></div>
  <main id="vista"></main>
  <nav id="nav"></nav>
</div>

<div id="recibo"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   EMMANUKIDS · Sistema de administración · versión en la nube
   Los datos viven en Firebase. Varias personas a la vez.
   ═══════════════════════════════════════════════════════════ */

import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,collection,onSnapshot,query,orderBy,limit,
  runTransaction,setDoc,getDoc,getDocs,writeBatch,deleteDoc,enableIndexedDbPersistence}
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ╔═══════════════════════════════════════════════════════╗
   ║  PEGA AQUÍ LOS DATOS DE TU PROYECTO FIREBASE          ║
   ║  Consola → ⚙ Configuración → Tus apps → Web           ║
   ╚═══════════════════════════════════════════════════════╝ */
const FIREBASE = {
  apiKey:            "AIzaSyAQB7LmzskNcajuX_EzkD_DzF35_CrhcCE",
  authDomain:        "emmakids-2bc21.firebaseapp.com",
  projectId:         "emmakids-2bc21",
  storageBucket:     "emmakids-2bc21.firebasestorage.app",
  messagingSenderId: "407227021780",
  appId:             "1:407227021780:web:45e620e0d1c1d8e1d7be41"
};

const app=initializeApp(FIREBASE);
const auth=getAuth(app);
const db=getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});

const rInv=doc(db,'estado','inventario');
const rCue=doc(db,'estado','cuentas');
const rCfg=doc(db,'config','general');

let S=null, tab='inicio', msg=null, tmp={}, yo=null, listos=0, PEND=null;
const admin=()=>yo?.rol==='ADMIN';

/* ── Utilidades ─────────────────────────────────────────── */
const $=id=>document.getElementById(id);
const cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(+n||0));
const num=n=>new Intl.NumberFormat('es-CO').format(Math.round(+n||0));
const hoy=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
const fecha=f=>{const d=new Date(f+'T12:00:00');return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'2-digit'})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const val=x=>{const e=$(x);return e?e.value:''};
const nval=x=>+String(val(x)).replace(/[^\d.-]/g,'')||0;

/* El aviso tiene su propio recuadro: cambiarlo no redibuja la pantalla,
   así no se pierde lo que estás escribiendo ni se siente lento.        */
function pintarMsg(){
  const e=document.getElementById('msg'); if(!e)return;
  e.innerHTML=msg?`<div class="aviso ${msg.tipo==='err'?'err':'ok'}"
    style="margin:0">${esc(msg.texto)}</div>`:'';
  e.style.display=msg?'block':'none';
}
let tMsg=null;
function decir(texto,tipo){
  msg={texto,tipo:tipo||'ok'}; pintarMsg();
  clearTimeout(tMsg);
  tMsg=setTimeout(()=>{msg=null;pintarMsg()},4500);
}

/* ── Datos iniciales ────────────────────────────────────── */
function nuevo(){
  return {
    empresa:{nombre:'EMMANUKIDS',tel:'',nit:''},
    colores:[{id:'c1',n:'Negro',hex:'#111'},{id:'c2',n:'Blanco',hex:'#fff'},
             {id:'c3',n:'Gris jaspe',hex:'#9aa0a6'},{id:'c4',n:'Azul rey',hex:'#1f4ea1'},
             {id:'c5',n:'Rojo',hex:'#c62828'}],
    tallas:[{id:'t1',n:'2'},{id:'t2',n:'4'},{id:'t3',n:'6'},{id:'t4',n:'8'},
            {id:'t5',n:'10'},{id:'t6',n:'12'},{id:'t7',n:'14'},{id:'t8',n:'16'}],
    disenos:[],
    lineas:[
      {id:'L1',n:'Económica',precio:37000,estampado:3500,margenMin:15,
       pack:{und:3,precio:97000},
       rangos:[{min:1,max:5,p:37000},{min:6,max:20,p:32000},{min:21,max:null,p:28000}]},
      {id:'L2',n:'Premium',precio:47000,estampado:6800,margenMin:15,
       pack:{und:3,precio:125000},
       rangos:[{min:1,max:5,p:47000},{min:6,max:20,p:41000},{min:21,max:null,p:36000}]}
    ],
    clientes:[{id:'cl0',n:'Consumidor final',tel:'',cupo:0}],
    proveedores:[],
    cuentas:[{id:'q1',n:'Efectivo',saldo:0},{id:'q2',n:'Nequi',saldo:0},
             {id:'q3',n:'Daviplata',saldo:0},{id:'q4',n:'Bancolombia',saldo:0}],
    catGastos:['Arriendo','Servicios','Envíos','Transporte','Publicidad','Insumos taller','Otros'],
    lisas:{}, terminados:{},
    compras:[], ordenes:[], facturas:[], pagos:[], gastos:[], pedidos:[],
    kardex:[], caja:[], asientos:[],
    consecutivo:0, stockMin:5
  };
}
/* Cada línea decide si controla diseños. Sin argumento = alguna los usa. */
const usaDis=lid=>lid?!!(linea(lid)||{}).usaDis:S.lineas.some(L=>L.usaDis);
const DGEN='gen';

/* ── Conexión con Firestore ─────────────────────────────── */
/* Los datos se reparten así:
   config/general      → catálogos, precios, clientes (lo que casi no cambia)
   estado/inventario   → existencias y costos  ← el que se pelean los usuarios
   estado/cuentas      → saldos de caja y bancos
   facturas, compras, ordenes, gastos, pagos, kardex, caja, asientos → historial
   Toda operación que toque inventario o plata corre dentro de una transacción,
   así dos personas vendiendo al tiempo nunca dejan el stock en negativo.       */

const CONFIG=['empresa','colores','tallas','disenos','lineas','clientes','proveedores',
  'catGastos','stockMin','consecutivo'];

async function sembrar(){
  const base=nuevo();
  const c=await getDoc(rCfg);
  if(!c.exists()){
    const o={}; CONFIG.forEach(k=>o[k]=base[k]);
    await setDoc(rCfg,o);
    await setDoc(rInv,{lisas:{},terminados:{}});
    await setDoc(rCue,{lista:base.cuentas});
  }
}

function escuchar(){
  S=nuevo();
  const listas=[['facturas',400],['compras',150],['ordenes',150],['gastos',300],
                ['pagos',400],['kardex',400],['caja',400],['asientos',400],
                ['pedidos',200]];

  onSnapshot(rCfg,d=>{ if(d.exists()) Object.assign(S,d.data());
    S.lineas.forEach(L=>{ if(!L.pack) L.pack={und:3,precio:Math.round(L.precio*3*0.87)} });
    refrescar() });
  onSnapshot(rInv,d=>{ const v=d.data()||{}; S.lisas=v.lisas||{}; S.terminados=v.terminados||{}; refrescar() });
  onSnapshot(rCue,d=>{ S.cuentas=(d.data()||{}).lista||S.cuentas; refrescar() });

  listas.forEach(([col,n])=>{
    onSnapshot(query(collection(db,col),orderBy('creado','desc'),limit(n)),
      s=>{ S[col]=s.docs.map(x=>({...x.data(),_id:x.id})); refrescar() },
      ()=>{});
  });
}

/* No repintar mientras alguien está escribiendo en un campo */
let pend=null;
function refrescar(){
  clearTimeout(pend);
  pend=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)) return refrescar();
    if(S){ pintar(); if(typeof pintarDev==='function') pintarDev() }
  },250);
}

/* Transacción: lee el estado real del servidor, aplica los cambios y los guarda
   todos juntos. Si algo falla a mitad, no queda nada a medias.                */
async function tx(fn,extras=[]){
  return runTransaction(db,async t=>{
    const iS=await t.get(rInv), cS=await t.get(rCue), gS=await t.get(rCfg);
    const ex=[]; for(const r of extras) ex.push(await t.get(r));

    const iv=iS.data()||{}; S.lisas=iv.lisas||{}; S.terminados=iv.terminados||{};
    S.cuentas=(cS.data()||{}).lista||S.cuentas;
    const g=gS.data()||{};
    S.consecutivo=g.consecutivo||0; S.consCompra=g.consCompra||0; S.consOrden=g.consOrden||0;
    S.consPedido=g.consPedido||0;

    PEND={docs:[],updates:[],cfg:null};
    const r=fn(ex);

    t.set(rInv,{lisas:S.lisas,terminados:S.terminados});
    t.set(rCue,{lista:S.cuentas});
    if(PEND.cfg) t.set(rCfg,PEND.cfg,{merge:true});
    PEND.docs.forEach(d=>t.set(doc(collection(db,d.col)),
      {...d.data,creado:Date.now(),por:yo.nombre,uid:yo.uid}));
    PEND.updates.forEach(u=>t.update(u.ref,u.data));
    return r;
  });
}
function nuevoDoc(col,data){PEND.docs.push({col,data})}

/* Un solo guardado a la vez: bloquea todos los botones mientras corre,
   así un doble clic (o dos toques seguidos) no duplica la operación.   */
let corriendo=false;
async function correr(fn,extras,ok){
  if(corriendo) return decir('Espera, se está guardando…','err');
  corriendo=true;
  const bts=[...document.querySelectorAll('button.b')];
  const previo=bts.map(b=>[b,b.disabled,b.textContent]);
  bts.forEach(b=>b.disabled=true);
  const activo=document.activeElement;
  if(activo&&activo.tagName==='BUTTON'&&activo.classList.contains('b'))
    activo.textContent='Guardando…';
  try{ const r=await tx(fn,extras||[]); decir(typeof ok==='function'?ok(r):ok) }
  catch(e){
    const permiso=/permission|insufficient|denied/i.test(e.code||e.message||'');
    decir(permiso
      ?'Firebase no deja guardar esto. Falta publicar la regla de esa colección en Consola → Firestore → Reglas.'
      :(e.message||'No se pudo guardar. Revisa la conexión.'),'err');
  }
  finally{
    corriendo=false;
    previo.forEach(([b,d,t])=>{ if(b.isConnected){ b.disabled=d; b.textContent=t } });
    pintar();
  }
}

/* ── Búsquedas ──────────────────────────────────────────── */
const color=i=>S.colores.find(x=>x.id===i)||{n:'?',hex:'#ccc'};
const talla=i=>S.tallas.find(x=>x.id===i)||{n:'?'};
const diseno=i=>S.disenos.find(x=>x.id===i)||{n:'General'};
const linea=i=>S.lineas.find(x=>x.id===i)||S.lineas[0];
const cliente=i=>S.clientes.find(x=>x.id===i)||{n:'Consumidor final'};
const cuenta=i=>S.cuentas.find(x=>x.id===i)||S.cuentas[0];

const kL=(c,t)=>c+'|'+t;
const kT=(d,l,c,t)=>[d,l,c,t].join('|');
const nomL=k=>{const[c,t]=k.split('|');return color(c).n+' · T'+talla(t).n};
const nomT=k=>{const[d,l,c,t]=k.split('|');
  return (usaDis(l)?diseno(d).n+' · ':'')+linea(l).n+' · '+color(c).n+' · T'+talla(t).n};

const invL=k=>S.lisas[k]||{cant:0,valor:0};
const invT=k=>S.terminados[k]||{cant:0,valor:0};
const costoL=k=>{const i=invL(k);return i.cant>0?i.valor/i.cant:0};
const costoT=k=>{const i=invT(k);return i.cant>0?i.valor/i.cant:0};

/* ── Motor de inventario (promedio ponderado móvil) ─────── */
function entrada(tipo,k,cant,costoUnit,dc){
  const inv=tipo==='L'?S.lisas:S.terminados;
  const a=inv[k]||{cant:0,valor:0};
  a.cant+=cant; a.valor+=cant*costoUnit; inv[k]=a;
  nuevoDoc('kardex',{f:dc.f,tipo,k,mov:'ENTRADA',cant,cu:costoUnit,
    saldo:a.cant,doc:dc.t,ref:dc.ref});
}
function salida(tipo,k,cant,dc){
  const inv=tipo==='L'?S.lisas:S.terminados;
  const a=inv[k]||{cant:0,valor:0};
  if(a.cant<cant) throw new Error('No hay suficiente '+(tipo==='L'?nomL(k):nomT(k))+
    '. Disponible: '+a.cant+', necesitas: '+cant);
  const cu=a.cant>0?a.valor/a.cant:0;
  a.cant-=cant; a.valor=Math.max(a.valor-cant*cu,0); inv[k]=a;
  nuevoDoc('kardex',{f:dc.f,tipo,k,mov:'SALIDA',cant,cu,saldo:a.cant,doc:dc.t,ref:dc.ref});
  return cu;
}
function mover(cuentaId,tipo,monto,concepto,f){
  const q=cuenta(cuentaId);
  q.saldo+=tipo==='INGRESO'?monto:-monto;
  nuevoDoc('caja',{f,cuenta:q.id,tipo,monto,saldo:q.saldo,concepto});
}
function asiento(f,concepto,lineas){
  const ls=lineas.filter(l=>(l.d||0)>0||(l.c||0)>0);
  nuevoDoc('asientos',{f,concepto,lineas:ls});
}

/* ── Precio por cantidad ────────────────────────────────── */
function precioPor(lineaId,cant,tipoVenta){
  const L=linea(lineaId);
  if(tipoVenta!=='MAYOR') return L.precio;
  const r=(L.rangos||[]).filter(r=>cant>=r.min&&(r.max==null||cant<=r.max))
    .sort((a,b)=>b.min-a.min)[0];
  return (r&&r.p>0)?r.p:L.precio;   // si el rango quedó vacío, cobra el de detal
}

const A={};

/* --- Ajuste de inventario: corregir conteo, mermas o pruebas --- */
A.ajustarInv=(tipo,k)=>{
  const nom=tipo==='L'?nomL(k):nomT(k);
  const inv=tipo==='L'?invL(k):invT(k);
  const v=prompt('Ajustar '+nom+'\n\nAhora la app dice: '+inv.cant+
    ' unidades.\n¿Cuántas hay realmente? (0 para borrarlas todas)', inv.cant);
  if(v===null) return;
  const real=Math.max(0,Math.round(+String(v).replace(/[^\d]/g,'')||0));
  if(real===inv.cant) return decir('Ese ya es el saldo que tiene','err');
  const motivo=prompt('¿Por qué el ajuste?\n(ej: prueba, se dañó, mal contado, regalada)','Ajuste')||'Ajuste';
  correr(()=>{
    const f=hoy(), dif=real-inv.cant, cu=tipo==='L'?costoL(k):costoT(k);
    const cuenta=tipo==='L'?'1435 Inventario lisas':'1430 Inventario estampadas';
    if(dif<0){
      const c=salida(tipo,k,-dif,{f,t:'AJUSTE',ref:motivo});
      asiento(f,'Ajuste inventario · '+nom+' · '+motivo,
        [{cuenta:'5299 Pérdida de inventario',d:c*-dif},{cuenta,c:c*-dif}]);
    }else{
      const base=cu||0;
      entrada(tipo,k,dif,base,{f,t:'AJUSTE',ref:motivo});
      asiento(f,'Ajuste inventario · '+nom+' · '+motivo,
        [{cuenta,d:base*dif},{cuenta:'3115 Capital',c:base*dif}]);
    }
    return {nom,real};
  },[],r=>r.nom+' quedó en '+r.real+' unidades');
};

const usadasProd=k=>(tmp.prod||[]).filter(r=>r.k===k).reduce((s,r)=>s+r.cant,0);
A.addProdFila=()=>{
  const t=val('pTal');
  const lId=tmp.lin||S.lineas[0].id;
  const dis=usaDis(lId)?val('pDis'):DGEN;
  if(usaDis(lId)&&!dis) return decir('Elige el diseño. Créalo en Ajustes si no está','err');

  tmp.prod=tmp.prod||[];
  // Primero se revisa todo; si algo no alcanza, no se agrega nada

  S.colores.forEach(c=>{
    const q=nval('pq_'+c.id); if(q<=0) return;

  });
  if(faltan.length) return decir('No alcanzan las lisas · '+faltan.join(' · ')+
    ' · No se agregó nada','err');

  let metidas=0;
  pedir.forEach(({k,q})=>{

    if(ya) ya.cant+=q; else tmp.prod.push({k,cant:q,merma:0,dis});
    metidas+=q;
  });

A.guardarProd=()=>{
  const filas=tmp.prod||[];
  if(!filas.length) return decir('Agrega qué camisetas vas a estampar','err');
  const lId=val('pLin'), dId=usaDis(lId)?val('pDis'):DGEN;
  if(usaDis(lId)&&!dId) return decir('Elige el diseño. Créalo en Ajustes si no está','err');
  const f=val('pFecha')||hoy(), est=nval('pEst'), mo=nval('pMO'), qId=val('pCuenta');
  const procesadas=filas.reduce((s,r)=>s+r.cant,0);
  const buenas=filas.reduce((s,r)=>s+(r.cant-r.merma),0);
  if(buenas<=0) return decir('La orden no deja unidades buenas','err');
  correr(()=>{
    const ref='OP'+(S.consOrden+1);
    PEND.cfg={consOrden:S.consOrden+1};
    let costoLisas=0;
    filas.forEach(r=>{costoLisas+=salida('L',r.k,r.cant,{f,t:'PRODUCCION',ref})*r.cant});
    const costoEst=est*procesadas;

      {cuenta:'1105 Caja y bancos',c:desembolso}]);
    const disUsados=[...new Set(filas.map(r=>r.dis||dId))];
    nuevoDoc('ordenes',{ref,f,diseno:dId,disenos:disUsados,linea:lId,filas,est,mo,
      procesadas,buenas,merma:procesadas-buenas,costoLisas,costoTotal:totalCosto,cu});
    return cu;
  },[],cu=>{tmp.prod=[];return num(buenas)+' camisetas listas · costo real '+cop(cu)+' c/u'});
};

/* Lisas de esa referencia que ya están comprometidas en el carrito */
function lisasEnCarrito(kl,menosId){
  return (tmp.carrito||[]).filter(x=>x.xm&&x.kl===kl&&x.id!==menosId)
    .reduce((s,x)=>s+x.cant,0);

A.agregar=k=>{

  tmp.carrito=tmp.carrito||[];

  if(ex){ if(ex.cant>=invT(k).cant) return decir('Solo quedan '+invT(k).cant+' unidades','err'); ex.cant++ }
  else tmp.carrito.push({id:k,k,cant:1});
  if(tmp.carAbierto===undefined) tmp.carAbierto=false;

};
/* Estampar al momento: sale de lisas, se estampa y se vende en la misma venta */
A.agregarXM=()=>{
  const l=val('xLin'), d=usaDis(l)?val('xDis'):DGEN, c=val('xCol'), t=val('xTal'), q=nval('xCant')||1;
  if(usaDis(l)&&!d) return decir('Primero crea el diseño en Ajustes','err');
  if(!l||!c||!t) return decir('Escoge línea, color y talla','err');
  const kl=kL(c,t), hay=invL(kl).cant;
  if(hay<=0) return decir('No hay lisas '+nomL(kl)+' en bodega','err');
  const k=kT(d,l,c,t), idx=k+'#X';
  tmp.carrito=tmp.carrito||[];
  const ex=tmp.carrito.find(x=>x.id===idx);
  const yaOtras=lisasEnCarrito(kl,idx);
  const tope=hay-yaOtras;
  const nueva=(ex?ex.cant:0)+q;
  if(nueva>tope) return decir('Solo quedan '+tope+' lisas '+nomL(kl)+' libres','err');
  if(ex) ex.cant=nueva; else tmp.carrito.push({id:idx,k,kl,xm:true,cant:q});
  tmp.xm=false; pintar();
};
A.cant=(id,d)=>{
  const c=(tmp.carrito||[]).find(x=>x.id===id); if(!c)return;
  if(d>0){
    const tope=c.xm?invL(c.kl).cant-lisasEnCarrito(c.kl,c.id):invT(c.k).cant;
    if(c.cant>=tope) return decir('No hay más unidades disponibles','err');
  }
  c.cant+=d;
  if(c.cant<=0) tmp.carrito=tmp.carrito.filter(x=>x.id!==id);
  pintar();
};
function lineasCarrito(){
  const tv=tmp.tipoVenta||'DETAL';
  const carro=tmp.carrito||[];
  const man=tmp.precioMan||{};

  // Modo pack: se cuentan TODAS las unidades de cada línea, aunque sean diseños
  // o tallas distintos. Cada 3 forman un pack; lo que sobra va a precio normal.
  const pack={};
  if(tv==='PACK'){
    const grupos={};
    carro.forEach(c=>{ if(man[c.id]!=null) return;
      const l=c.k.split('|')[1]; grupos[l]=(grupos[l]||0)+c.cant });
    Object.entries(grupos).forEach(([l,n])=>{
      const L=linea(l), P=L.pack||{und:3,precio:L.precio*3};
      // Precio del pack que el usuario escribió para ESTA venta; si no, el de la lista
      const pp=(tmp.packMan||{})[l]!=null?tmp.packMan[l]:P.precio;
      const packs=Math.floor(n/P.und), resto=n%P.und;
      const total=packs*pp+resto*L.precio;
      pack[l]={unit:n>0?total/n:L.precio,packs,resto,und:P.und,precioPack:pp,
               dePista:pp!==P.precio,linea:L.n};
    });
  }
  tmp._pack=pack;

  const base=carro.map(c=>{
    const l=c.k.split('|')[1];
    let p, origen;
    if(man[c.id]!=null){ p=man[c.id]; origen='manual' }
    else if(tv==='PACK'&&pack[l]){ p=pack[l].unit; origen='pack' }
    else { p=precioPor(l,c.cant,tv); origen=tv.toLowerCase() }
    const neto=p*c.cant, cu=c.xm?costoL(c.kl)+(linea(l).estampado||0):costoT(c.k);
    return {...c,precio:p,origen,neto,cu,costo:cu*c.cant,util:neto-cu*c.cant};
  });

  /* Precio de combo: escribes el total de la venta y la app lo reparte entre
     las camisetas según lo que vale cada una en la lista. Sirve para packs
     mezclados (1 económica + 2 premium) o para 4, 5, 6 al mismo precio.   */
  if(tmp.totalMan>0&&base.length){
    const peso=base.map(l=>linea(l.k.split('|')[1]).precio*l.cant);
    const suma=peso.reduce((s,x)=>s+x,0)||1;
    let repartido=0;
    base.forEach((l,i)=>{
      const neto=i===base.length-1?tmp.totalMan-repartido
        :Math.round(tmp.totalMan*peso[i]/suma);
      repartido+=neto;
      l.neto=neto; l.precio=neto/l.cant; l.origen='combo'; l.util=neto-l.costo;
    });
  }
  return base;
}

A.cobrar=fiado=>{
  const ls=lineasCarrito();
  if(!ls.length) return decir('El carrito está vacío','err');
  const f=hoy(), clId=val('vCliente')||'cl0', qId=val('vCuenta');
  const nota=(val('vNota')||'').trim();
  const envio=nval('vEnvio');
  const totalProd=ls.reduce((s,l)=>s+l.neto,0);
  const total=totalProd+envio;
  const costo=ls.reduce((s,l)=>s+l.costo,0);
  for(const l of ls){
    if(l.neto<l.costo) return decir(nomT(l.k)+' quedaría por debajo del costo ('+cop(l.cu)+' c/u)','err');
    const m=l.neto>0?(l.util/l.neto)*100:0;
    const min=linea(l.k.split('|')[1]).margenMin||0;
    if(m<min&&!confirm(nomT(l.k)+' deja solo '+m.toFixed(1)+'% de margen (mínimo '+min+'%).\n¿Vender de todos modos?')) return;
  }
  const antic=Math.min(tmp.antic?tmp.antic.monto:0,total);
  let recibido=fiado?antic+nval('vAbono'):total;
  if(recibido>total) recibido=total;
  if(recibido<antic) recibido=antic;
  const nuevo=recibido-antic;          // lo que entra hoy a la cuenta
  const saldo=total-recibido;
  if(saldo>0&&clId==='cl0') return decir('Para fiar necesitas escoger un cliente con nombre','err');
  const limite=saldo>0?(val('vLimite')||''):'';
  const tipoV=tmp.tipoVenta||'DETAL';
  correr(()=>{
    // El consecutivo se toma del servidor dentro de la transacción:
    // aunque dos vendan al mismo segundo, no se repite el número.
    const nro='A-'+String(S.consecutivo+1).padStart(5,'0');
    PEND.cfg={consecutivo:S.consecutivo+1};
    let costoLisas=0, estTotal=0;
    const det=ls.map(l=>{
      // Estampado al momento: la lisa sale de bodega, se estampa y entra ya lista
      if(l.xm){
        const est=linea(l.k.split('|')[1]).estampado||0;
        const cul=salida('L',l.kl,l.cant,{f,t:'ESTAMPADO',ref:nro});
        costoLisas+=cul*l.cant; estTotal+=est*l.cant;
        entrada('T',l.k,l.cant,cul+est,{f,t:'ESTAMPADO',ref:nro});
      }
      const cu=salida('T',l.k,l.cant,{f,t:'VENTA',ref:nro});
      return {k:l.k,cant:l.cant,precio:l.precio,origen:l.origen,neto:l.neto,cu,xm:!!l.xm,
              costo:cu*l.cant,util:l.neto-cu*l.cant};
    });
    const costoReal=det.reduce((s,d)=>s+d.costo,0);
    if(estTotal>0&&qId) mover(qId,'EGRESO',estTotal,'Transfers venta '+nro,f);
    nuevoDoc('facturas',{nro,f,cliente:clId,nota,envio,tipo:tipoV,det,total,
      abonado:recibido,antic,saldo,costo:costoReal,util:total-costoReal,limite,cuentaPago:qId,
      estado:saldo<=0?'PAGADA':(recibido>0?'PARCIAL':'PENDIENTE')});
    if(nuevo>0){
      nuevoDoc('pagos',{fac:nro,f,monto:nuevo,cuenta:qId,metodo:cuenta(qId).n});
      mover(qId,'INGRESO',nuevo,'Venta '+nro,f);
    }
    if(antic>0&&tmp.antic) PEND.updates.push(
      {ref:doc(db,'pedidos',tmp.antic.ped),data:{estado:'ENTREGADO'}});
    asiento(f,'Venta '+nro,[
      {cuenta:'1105 Caja y bancos',d:nuevo},
      {cuenta:'2805 Anticipos de clientes',d:antic},
      {cuenta:'1305 Clientes',d:saldo},
      {cuenta:'4135 Ventas',c:totalProd},
      {cuenta:'4210 Envíos cobrados',c:envio},
      {cuenta:'6135 Costo de ventas',d:costoReal},
      {cuenta:'1430 Inventario estampadas',c:costoReal},
      {cuenta:'1430 Inventario estampadas',d:costoLisas+estTotal},
      {cuenta:'1435 Inventario lisas',c:costoLisas},
      {cuenta:'1105 Caja y bancos',c:estTotal}]);
    return nro;
  },[],nro=>{tmp.carrito=[];tmp.precioMan={};tmp.packMan={};tmp.totalMan=0;tmp.cobrando=false;tmp.nota='';tmp.envio=0;tmp.antic=null;
    return 'Factura '+nro+' por '+cop(total)+(saldo>0?' · queda debiendo '+cop(saldo):'')});
};

function cerrarDev(){ const m=$('mDev'); if(m)m.remove(); tmp.dev={}; tmp.devFac=null }
window.cerrarDev=cerrarDev;
function pintarDev(){
  const c=$('cDev'); if(!c)return;
  const fac=S.facturas.find(x=>x._id===tmp.devFac); if(!fac)return;
  const dev=tmp.dev||{};
  const yaDev=fac.devuelto||{};
  const valor=fac.det.reduce((s,x,i)=>s+(dev[i]||0)*x.precio,0);
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <b style="font-size:17px">Devolución · ${fac.nro}</b>

    <p style="font-size:13px;color:var(--suave);margin:0 0 12px">
      Marca cuántas te devolvió de cada una. Vuelven al inventario y se descuenta de la venta.</p>
    ${fac.det.map((x,i)=>{
      const tope=x.cant-(yaDev[i]||0);
      if(tope<=0) return `<div class="item" style="opacity:.45">
        <div><div class="t">${esc(nomT(x.k))}</div>
          <div class="s">ya devuelta</div></div></div>`;
      return `<div class="item">
        <div><div class="t">${esc(nomT(x.k))}</div>
          <div class="s">llevó ${tope} · ${cop(x.precio)} c/u</div></div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="b g chico" style="min-height:34px;padding:0 11px"
            onclick="A.devCant(${i},-1)">−</button>
          <b class="cifra" style="min-width:20px;text-align:center">${dev[i]||0}</b>
          <button class="b g chico" style="min-height:34px;padding:0 11px"
            onclick="A.devCant(${i},1,${tope})">+</button>
        </div></div>`}).join('')}
    <div class="item" style="border-top:1px solid var(--linea)">
      <div class="t">A devolver</div>
      <div class="m cifra" style="font-size:20px">${cop(valor)}</div></div>
    ${valor>0?`
      ${fac.saldo>0?`<div class="aviso ok">Se baja primero de lo que te debe (${cop(fac.saldo)}).</div>`:''}
      <label>Si hay que devolver plata, sale de</label>
      <select id="dCuenta">${optCuenta()}</select>
      <button class="b" style="margin-top:12px" onclick="A.guardarDevol()">Registrar devolución</button>
      <div style="font-size:12px;color:var(--suave);margin-top:8px;text-align:center">
        ¿Cambió por otra? Registra la devolución y véndele la nueva normal.</div>
    `:'<div class="vacio">Marca al menos una camiseta.</div>'}`;
}
A.devCant=(i,d,tope)=>{
  tmp.dev=tmp.dev||{};
  const v=(tmp.dev[i]||0)+d;
  if(d>0&&v>tope) return;
  tmp.dev[i]=Math.max(0,v);
  pintarDev();
};
A.guardarDevol=()=>{
  const facId=tmp.devFac, dev={...(tmp.dev||{})};
  const fac=S.facturas.find(x=>x._id===facId); if(!fac)return;
  const qId=val('dCuenta');
  const items=Object.entries(dev).filter(([,q])=>q>0);
  if(!items.length) return decir('Marca al menos una camiseta','err');
  const f=hoy(), ref=doc(db,'facturas',facId);
  correr(ex=>{
    const d0=ex[0].data();
    if(d0.estado==='ANULADA') throw new Error('Esa factura está anulada');
    const yaDev=d0.devuelto||{};
    let valor=0, costoDev=0;
    const nuevoDev={...yaDev};
    items.forEach(([i,q])=>{
      const x=d0.det[i];
      if(!x) throw new Error('La factura cambió, vuelve a abrirla');
      if((yaDev[i]||0)+q>x.cant) throw new Error('No puedes devolver más de lo que llevó');
      entrada('T',x.k,q,x.cu,{f,t:'DEVOLUCION',ref:d0.nro});
      valor+=q*x.precio; costoDev+=q*x.cu;
      nuevoDev[i]=(yaDev[i]||0)+q;
    });
    // Primero se baja la deuda; lo que sobre sale de la cuenta
    const bajaSaldo=Math.min(valor,d0.saldo||0);
    const plata=valor-bajaSaldo;
    if(plata>0) mover(qId,'EGRESO',plata,'Devolución '+d0.nro,f);
    const total=d0.total-valor, abonado=(d0.abonado||0)-plata, saldo=(d0.saldo||0)-bajaSaldo;
    const costo=(d0.costo||0)-costoDev;
    asiento(f,'Devolución '+d0.nro,[
      {cuenta:'4175 Devoluciones en ventas',d:valor},
      {cuenta:'1105 Caja y bancos',c:plata},
      {cuenta:'1305 Clientes',c:bajaSaldo},
      {cuenta:'1430 Inventario estampadas',d:costoDev},
      {cuenta:'6135 Costo de ventas',c:costoDev}]);
    PEND.updates.push({ref,data:{devuelto:nuevoDev,total,abonado,saldo,costo,
      util:total-costo,estado:total<=0?'ANULADA':(saldo<=0?'PAGADA':(abonado>0?'PARCIAL':'PENDIENTE'))}});
    return {v:valor,p:plata};
  },[ref],r=>{cerrarDev();
    return 'Devolución de '+cop(r.v)+(r.p>0?' · salieron '+cop(r.p)+' de la cuenta':' · bajó la deuda')});
};

A.anularOrden=id=>{
  const o=S.ordenes.find(x=>x._id===id); if(!o)return;

    o.procesadas+' lisas vuelven a bodega.')) return;

    d0.filas.forEach(r=>{
      const b=r.cant-r.merma;
      const [c,t]=r.k.split('|');
      if(b>0) salida('T',kT(r.dis||d0.diseno,d0.linea,c,t),b,{f,t:'ANULACION',ref:d0.ref});
      entrada('L',r.k,r.cant,cuL,{f,t:'ANULACION',ref:d0.ref});

    if(desembolso>0) mover(S.cuentas[0].id,'INGRESO',desembolso,'Anulación '+d0.ref,f);
    asiento(f,'Anulación '+d0.ref,[
      {cuenta:'1435 Inventario lisas',d:d0.costoLisas},
      {cuenta:'1105 Caja y bancos',d:desembolso},
      {cuenta:'1430 Inventario estampadas',c:d0.costoTotal}]);

/* --- Empezar de cero: borra movimientos, deja los catálogos --- */
A.empezarCero=async()=>{
  if(!admin()) return decir('Solo el administrador','err');
  if(!confirm('BORRAR TODOS LOS MOVIMIENTOS\n\n'+
    'Se van: facturas, compras, producciones, gastos, abonos, movimientos de caja e inventario.\n'+
    'Se quedan: colores, tallas, diseños, clientes, proveedores y precios.\n\n'+
    'Esto NO se puede deshacer. ¿Seguir?')) return;
  const w=prompt('Escribe BORRAR (en mayúsculas) para confirmar:');
  if(w!=='BORRAR') return decir('Cancelado');
  decir('Borrando… no cierres la página');
  try{
    const cols=['facturas','compras','ordenes','gastos','pagos','kardex','caja','asientos'];
    for(const c of cols){
      let quedan=true;
      while(quedan){
        const s=await getDocs(query(collection(db,c),limit(400)));
        if(s.empty){ quedan=false; break }
        const b=writeBatch(db);
        s.docs.forEach(d=>b.delete(d.ref));
        await b.commit();
        quedan=s.size===400;
      }
    }
    await setDoc(rInv,{lisas:{},terminados:{}});
    await setDoc(rCue,{lista:S.cuentas.map(q=>({...q,saldo:0}))});
    await setDoc(rCfg,{consecutivo:0,consCompra:0,consOrden:0},{merge:true});
    decir('Listo · todo en cero. Ya puedes cargar tu inventario real.');

};

A.addPedidoFila=()=>{

  const c=val('qCol'), t=val('qTal'), q=nval('qCant')||1;
  if(usaDis(l)&&!d) return decir('Primero crea el diseño en Ajustes','err');
  if(!l||!c||!t) return decir('Escoge línea, color y talla','err');
  tmp.ped=tmp.ped||[];
  const k=kT(d,l,c,t);
  const ya=tmp.ped.find(r=>r.k===k);
  if(ya) ya.cant+=q; else tmp.ped.push({k,cant:q});
  $('qCant').value='1';

  decir(q+' × '+nomT(k)+' anotada');

/* Manda las camisetas del pedido al formulario de Taller */
A.pedidoATaller=id=>{
  const p=S.pedidos.find(x=>x._id===id); if(!p)return;
  const lin=p.items[0].k.split('|')[1];
  const otras=p.items.some(r=>r.k.split('|')[1]!==lin);
  tmp.lin=lin; tmp.prod=[];
  const sinLisa=[]; let cargadas=0;
  p.items.filter(r=>r.k.split('|')[1]===lin).forEach(r=>{
    // Solo se manda a estampar lo que NO está ya en bodega
    const falta=r.cant-invT(r.k).cant;
    if(falta<=0) return;
    const [d,,c,t]=r.k.split('|'), kl=kL(c,t);
    const libres=invL(kl).cant-tmp.prod.filter(x=>x.k===kl).reduce((s,x)=>s+x.cant,0);
    if(libres<falta){ sinLisa.push(nomL(kl)+' (hay '+libres+', faltan '+falta+')'); return }
    tmp.prod.push({k:kl,cant:falta,merma:0,dis:d});
    cargadas+=falta;
  });
  ir('taller');
  decir(sinLisa.length?'Faltan lisas · '+sinLisa.join(' · '):
    (!cargadas?'Ya tienes todo estampado para ese pedido':
     'Solo lo que falta: '+cargadas+' camiseta'+(cargadas===1?'':'s')+
     (otras?'. Lo de la otra línea va en una tanda aparte.':'')),
    sinLisa.length?'err':'ok');
};
/* Manda las camisetas del pedido al carrito de Vender */
A.pedidoAVenta=id=>{
  const p=S.pedidos.find(x=>x._id===id); if(!p)return;
  tmp.carrito=[]; tmp.precioMan={}; tmp.packMan={}; tmp.totalMan=0;
  const faltan=[];
  p.items.forEach(r=>{
    if(invT(r.k).cant<r.cant){ faltan.push(nomT(r.k)+' (hay '+invT(r.k).cant+')'); return }
    tmp.carrito.push({id:r.k,k:r.k,cant:r.cant});
  });
  tmp.ultCli=p.cliente;
  tmp.nota=p.ref+(p.nom&&p.cliente==='cl0'?' · '+p.nom:'')+(p.nota?' · '+p.nota:'');
  tmp.antic=(p.abonado||0)>0?{monto:p.abonado,ped:p._id,ref:p.ref}:null;
  ir('vender');
  decir(faltan.length?'Sin estampar todavía: '+faltan.join(' · '):
    'Carrito listo · cobra y después marca el pedido como entregado',
    faltan.length?'err':'ok');
};

/* --- Gama de colores del proveedor --- */
const GAMA=[
  ['Blanco','#F1F2F4'],      ['Marfil','#FAF7E6'],
  ['Vainilla','#F6EDC2'],    ['Nude','#E3D3BB'],
  ['Arena','#C8BBA7'],       ['Cocoa','#9B8E7F'],
  ['Café','#4D3927'],        ['Lila','#A87FE7'],
  ['Rojo','#E5241A'],        ['Palo de rosa','#F3A9AC'],
  ['Gris medio','#7A8894'],  ['Gris oscuro','#463D37'],
  ['Negro','#0D0D0D'],       ['Verde seco','#9BAEA1'],
  ['Verde botella','#13533E'],['Azul bebé','#90D2F4']
];
A.cargarGama=()=>{
  // Compara sin tildes, sin espacios y sin "de", para que "Cafe"="Café"
  // y "Palo rosa"="Palo de rosa" se reconozcan como el mismo color.
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/\bde\b/g,'').replace(/[^a-z]/g,'');
  let nuevos=0, pintados=0;
  GAMA.forEach(([n,hex])=>{
    const ya=S.colores.find(c=>norm(c.n)===norm(n));
    if(ya){ if(ya.hex!==hex){ ya.hex=hex; pintados++ } }
    else { S.colores.push({id:id(),n,hex}); nuevos++ }
  });
  if(!nuevos&&!pintados) return decir('Ya tenías toda la gama cargada');
  guardarCfg({colores:S.colores});
  decir((nuevos?nuevos+' colores nuevos':'')+(nuevos&&pintados?' · ':'')+
        (pintados?pintados+' con su color real':''));
  pintar();
};
A.addCat=(lista,campo)=>{
  const v=val(campo).trim(); if(!v)return;
  if(lista==='disenos') S.disenos.push({id:id(),n:v});
  if(lista==='colores') S.colores.push({id:id(),n:v,hex:'#888'});
  if(lista==='tallas') S.tallas.push({id:id(),n:v});
  if(lista==='clientes') S.clientes.push({id:id(),n:v,tel:'',cupo:0});
  if(lista==='proveedores') S.proveedores.push({id:id(),n:v});
  if(lista==='cuentas'){ S.cuentas.push({id:id(),n:v,saldo:0});
    setDoc(rCue,{lista:S.cuentas}); $(campo).value=''; return pintar() }
  $(campo).value=''; guardarCfg({[lista]:S[lista]}); pintar();
};
A.delCat=(lista,i)=>{ if(!confirm('¿Borrar?'))return;
  S[lista].splice(i,1);
  if(lista==='cuentas') setDoc(rCue,{lista:S.cuentas}); else guardarCfg({[lista]:S[lista]});
  pintar() };
A.guardarPrecios=()=>{
  // Un precio de venta en 0 haría que todo se venda regalado: no se guarda.
  for(let i=0;i<S.lineas.length;i++){
    if(nval('lp'+i)<=0) return decir('El precio al detal de '+
      (val('ln'+i)||S.lineas[i].n)+' no puede quedar en 0','err');
  }
  S.lineas.forEach((L,i)=>{
    L.n=val('ln'+i).trim()||L.n;
    L.precio=nval('lp'+i); L.estampado=nval('le'+i); L.margenMin=nval('lm'+i);
    L.usaDis=!!($('ld'+i)||{}).checked;
    L.rangos=[
      {min:1,max:5,p:nval('r'+i+'a')||L.precio},
      {min:6,max:20,p:nval('r'+i+'b')||L.precio},
      {min:21,max:null,p:nval('r'+i+'c')||L.precio}];
    L.pack={und:nval('pu'+i)||3,precio:nval('pp'+i)||L.precio*3};
  });
  S.stockMin=nval('stockMin')||5;
  S.empresa={nombre:val('eNom')||'EMMANUKIDS',tel:val('eTel'),nit:val('eNit')};
  guardarCfg({lineas:S.lineas,stockMin:S.stockMin,empresa:S.empresa});
  decir('Precios y ajustes guardados. Los demás los ven al instante.');
};

  const sum=(a,c)=>a.reduce((s,x)=>s+x[c],0);
  const cartera=act.filter(f=>f.saldo>0);
  const vencida=cartera.filter(f=>f.limite&&f.limite<h);
  const lisas=Object.values(S.lisas).reduce((s,i)=>s+i.cant,0);
  const term=Object.values(S.terminados).reduce((s,i)=>s+i.cant,0);

                 Object.values(S.terminados).reduce((s,i)=>s+i.valor,0);
  const gm=S.gastos.filter(g=>g.f.startsWith(mes)).reduce((s,g)=>s+g.monto,0);
  const utilMes=sum(vm,'util')-gm;

  const top={};
  vm.forEach(f=>f.det.forEach(d=>{top[d.k]=(top[d.k]||0)+d.cant}));
  const ranking=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return `

      <div class="et">📈 Ventas del mes</div><div class="v cifra" style="color:var(--cielo)">${cop(sum(vm,'total'))}</div>
      <div class="d">${vm.length} facturas · ver ▸</div></div>
    <div class="kpi"><div class="et">💰 Utilidad del mes</div><div class="v cifra" style="color:${utilMes>=0?'var(--ok)':'var(--tinta)'}">${cop(utilMes)}</div>
      <div class="d">después de ${cop(gm)} en gastos</div></div>
    <div class="kpi"><div class="et">⏳ Por cobrar</div><div class="v cifra" style="color:var(--sol)">${cop(sum(cartera,'saldo'))}</div>
      <div class="d">${vencida.length?cop(sum(vencida,'saldo'))+' vencido':'al día'}</div></div>
  </div>

  <div class="card"><h3>Inventario</h3>
    <div class="g2">
      <div><div class="et" style="font-size:10.5px;color:var(--suave);font-weight:700">Lisas</div>
        <div style="font-size:20px;font-weight:800" class="cifra">${num(lisas)}</div>
        <div style="font-size:12px;color:var(--suave)" class="cifra">${
          cop(Object.values(S.lisas).reduce((s,v)=>s+v.valor,0))}</div></div>
      <div><div class="et" style="font-size:10.5px;color:var(--suave);font-weight:700">Estampadas</div>
        <div style="font-size:20px;font-weight:800" class="cifra">${num(term)}</div>
        <div style="font-size:12px;color:var(--suave)" class="cifra">${
          cop(Object.values(S.terminados).reduce((s,v)=>s+v.valor,0))}</div></div>
    </div>
    <div class="d" style="font-size:12px;color:var(--suave);margin-top:8px;padding-top:8px;
      border-top:1px solid var(--linea)">Valor total en bodega: <b>${cop(valorInv)}</b></div>

  <div class="card"><h3>Lo más vendido este mes</h3>

      <div><div class="t">${esc(nomT(k))}</div></div>

    </div>
    <div class="fila" style="margin-top:8px">
      <input id="cCosto" inputmode="numeric" placeholder="Costo unitario" value="${tmp.ultCosto||''}">
      <button class="b n chico" style="flex:0 0 auto" onclick="A.addCompraFila()">Agregar</button>
    </div>

    ${filas.length?`<div style="margin-top:14px">
      ${filas.map((r,i)=>`<div class="item">
        <div><div class="t">${esc(nomL(r.k))}</div><div class="s cifra">${r.cant} × ${cop(r.cu)}</div></div>
        <div class="m"><span class="cifra">${cop(r.cant*r.cu)}</span>
          <button class="b g chico" style="margin-left:8px;min-height:30px" onclick="A.delCompraFila(${i})">✕</button></div>
      </div>`).join('')}
      <div class="item"><div class="t">${num(unidades)} unidades</div>
        <div class="m cifra">${cop(sub)}</div></div>
    </div>`:'<div class="vacio">Sin filas todavía. Agrega la primera arriba.</div>'}

    <div class="g2">
      <div><label>Flete (se reparte)</label><input id="cFlete" inputmode="numeric" value="0"></div>
      <div><label>Se paga desde</label><select id="cCuenta">${optCuenta()}</select></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;letter-spacing:0">
      <input type="checkbox" id="cCredito" style="width:auto;min-height:auto"> Queda debiendo al proveedor</label>
    <button class="b" style="margin-top:12px" onclick="A.guardarCompra()">Guardar compra</button>
  </div>

  <div class="card"><h3>Compras recientes</h3>
    ${S.compras.slice(0,15).map(c=>`<div class="item">
      <div><div class="t">${esc(c.nro||c.ref)}${c.estado==='ANULADA'?' <span class="tag rojo">ANULADA</span>':''}</div>
        <div class="s">${fecha(c.f)} · ${esc(c.prov||'sin proveedor')} · ${num(c.items.reduce((s,i)=>s+i.cant,0))} und</div>
        ${c.estado!=='ANULADA'&&admin()?`<div style="margin-top:6px">
          <button class="b g chico" onclick="A.anularCompra('${c._id}')">Anular</button></div>`:''}</div>
      <div class="m cifra">${cop(c.total)}</div></div>`).join('')||'<div class="vacio">Aún no has registrado compras.</div>'}
  </div>`;
}

/* ── Taller ─────────────────────────────────────────────── */
function vTaller(){
  const filas=tmp.prod||[];
  const proc=filas.reduce((s,r)=>s+r.cant,0);
  const buenas=filas.reduce((s,r)=>s+(r.cant-r.merma),0);
  const est=nval('pEst'), mo=nval('pMO');
  const costoLisas=filas.reduce((s,r)=>s+costoL(r.k)*r.cant,0);
  const cuEstimado=buenas>0?(costoLisas+est*proc+mo)/buenas:0;

  return `
  <div class="card"><h3>Registrar estampado</h3>
    ${usaDis(tmp.lin||S.lineas[0].id)&&!S.disenos.length?'<div class="aviso err">Primero crea al menos un diseño en Ajustes.</div>':''}
    <div class="g2">
      <div><label>Fecha</label><input type="date" id="pFecha" value="${hoy()}"></div>
      <div><label>Tipo de estampado</label><select id="pLin" onchange="tmp.lin=this.value;pintar()">
        ${S.lineas.map(l=>`<option value="${l.id}"${tmp.lin===l.id?' selected':''}>${esc(l.n)}</option>`).join('')}</select></div>
    </div>
    <label>¿Qué camisetas lisas vas a usar?</label>
    ${usaDis(tmp.lin||S.lineas[0].id)?`<select id="pDis" style="margin-bottom:8px">${
      S.disenos.map(d=>`<option value="${d.id}">${esc(d.n)}</option>`).join('')}</select>`:''}
    <select id="pTal" onchange="tmp.pTal=this.value;pintar()">${optTalla(tmp.pTal)}</select>
    <div style="font-size:11.5px;color:var(--suave);margin:6px 0 0">
      Llena solo los colores que vas a estampar. El número gris es cuántas lisas hay.${
      usaDis(tmp.lin||S.lineas[0].id)?' Cambia el diseño antes de agregar si llevan estampados distintos.':''}</div>
    ${(()=>{
      const tSel=tmp.pTal||S.tallas[0].id;
      const disp=S.colores.filter(c=>invL(kL(c.id,tSel)).cant-usadasProd(kL(c.id,tSel))>0);
      if(!disp.length) return `<div class="aviso err" style="margin-top:10px">
        No hay lisas disponibles en la talla ${esc(talla(tSel).n)}.</div>`;
      return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
        gap:8px;margin-top:10px">
        ${disp.map(c=>{const libres=invL(kL(c.id,tSel)).cant-usadasProd(kL(c.id,tSel));
          return `<label class="swatch">
            <span class="sw-cara" style="background:${c.hex}"></span>
            <span class="sw-nom">${esc(c.n)} <b style="color:var(--suave)">${libres}</b></span>
            <input id="pq_${c.id}" inputmode="numeric" placeholder="0"></label>`}).join('')}
      </div>`;
    })()}
    <button class="b n chico" style="margin-top:10px" onclick="A.addProdFila()">
      Agregar esta talla</button>

    ${filas.length?`<div style="margin-top:14px">
      ${filas.map((r,i)=>`<div class="item">
        <div><div class="t">${usaDis(tmp.lin||S.lineas[0].id)?
          `<span class="tag" style="margin-right:5px">${esc(diseno(r.dis).n)}</span>`:''}${esc(nomL(r.k))}</div>
          <div class="s">${r.cant} usadas${r.merma?' · <b style="color:var(--tinta)">'+r.merma+' dañadas</b>':''} · lisa a ${cop(costoL(r.k))}</div></div>
        <div class="m" style="display:flex;gap:5px">
          <button class="b g chico" style="min-height:30px;padding:0 9px"
            onclick="A.prodMerma(${i})" title="Marcar dañadas">⚠</button>
          <button class="b g chico" style="min-height:30px" onclick="A.delProdFila(${i})">✕</button></div>
      </div>`).join('')}</div>`:'<div class="vacio">Agrega qué lisas entran al estampado.</div>'}

    <div class="g2">
      <div><label>Transfer DTF c/u</label>
        <input id="pEst" inputmode="numeric" value="${tmp.lin?linea(tmp.lin).estampado:S.lineas[0].estampado}" oninput="pintarSoloCosto()"></div>
      <div><label>Mano de obra total</label><input id="pMO" inputmode="numeric" value="0" oninput="pintarSoloCosto()"></div>
    </div>
    <label>Se paga desde</label><select id="pCuenta">${optCuenta()}</select>

    ${filas.length?`<div class="aviso ok" style="margin-top:12px" id="costoPrev">
      ${num(buenas)} buenas de ${num(proc)} · costo real <b>${cop(cuEstimado)}</b> cada una</div>`:''}
    <button class="b" onclick="A.guardarProd()">Registrar producción</button>
  </div>

  <div class="card"><h3>Producciones anteriores</h3>
    ${S.ordenes.slice(0,15).map(o=>`<div class="item">
      <div><div class="t">${usaDis(o.linea)?esc((()=>{
        const ds=[...new Set((o.filas||[]).map(r=>r.dis||o.diseno))];
        return ds.length>1?ds.length+' diseños':diseno(ds[0]).n})())+' · ':''}${esc(linea(o.linea).n)}${
        o.estado==='ANULADA'?' <span class="tag rojo">ANULADA</span>':''}</div>
        <div class="s">${o.ref||''} · ${fecha(o.f)} · ${o.buenas} buenas${o.merma?', '+o.merma+' dañadas':''}</div>
        <button onclick="A.verLote('${o._id}')" style="border:0;background:none;padding:3px 0;
          color:var(--tinta);font-size:12.5px;font-weight:600;cursor:pointer">
          ${(tmp.lote||{})[o._id]?'▾ Ocultar detalle':'▸ Ver qué lleva'}</button>
        ${(tmp.lote||{})[o._id]?`<div style="background:#faf9fb;border-radius:11px;padding:9px 11px;
          margin-top:4px;font-size:12.5px">
          ${(o.filas||[]).map(r=>{const [c,t]=r.k.split('|');
            return `<div style="padding:2.5px 0">
              <span class="punto" style="background:${color(c).hex}"></span>
              ${usaDis(o.linea)?'<b>'+esc(diseno(r.dis||o.diseno).n)+'</b> · ':''}${esc(color(c).n)} ·
              T${esc(talla(t).n)} · <b>${r.cant-r.merma}</b>${r.merma?` <span style="color:var(--tinta)">(${r.merma} dañada${r.merma===1?'':'s'})</span>`:''}
            </div>`}).join('')||'<div style="color:var(--suave)">Sin detalle guardado</div>'}
          <div style="border-top:1px solid var(--linea);margin-top:6px;padding-top:6px;color:var(--suave)">
            Lisas ${cop(o.costoLisas)} · transfer ${cop(o.est*o.procesadas)} · mano de obra ${cop(o.mo)}
            → total ${cop(o.costoTotal)}</div>
        </div>`:''}
        ${o.estado!=='ANULADA'&&admin()?`<div style="margin-top:6px">
          <button class="b g chico" onclick="A.anularOrden('${o._id}')">Anular</button></div>`:''}</div>
      <div class="m cifra">${cop(o.cu)}<div class="s" style="font-weight:400">c/u</div></div></div>`).join('')
      ||'<div class="vacio">Todavía no has registrado estampados.</div>'}
  </div>`;
}
function pintarSoloCosto(){
  const e=$('costoPrev'); if(!e)return;
  const filas=tmp.prod||[];
  const proc=filas.reduce((s,r)=>s+r.cant,0), buenas=filas.reduce((s,r)=>s+(r.cant-r.merma),0);
  const costoLisas=filas.reduce((s,r)=>s+costoL(r.k)*r.cant,0);
  const cu=buenas>0?(costoLisas+nval('pEst')*proc+nval('pMO'))/buenas:0;
  e.innerHTML=num(buenas)+' buenas de '+num(proc)+' · costo real <b>'+cop(cu)+'</b> cada una';
}

/* ── Inventario ─────────────────────────────────────────── */
function vInventario(){
  const q=(tmp.qInv||'').trim();
  const nm=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const pal=nm(q).split(/\s+/).filter(Boolean);
  // Una palabra "pega" con un color o una talla si aparece en su nombre
  const pegaCol=c=>pal.some(w=>nm(c.n).includes(w));
  const pegaTal=t=>pal.some(w=>nm('t'+t.n).includes(w)||nm(t.n).includes(w));
  const hayCol=q&&S.colores.some(pegaCol), hayTal=q&&S.tallas.some(pegaTal);
  const fTal=tmp.fTal||'', fDis=tmp.fDis||'';
  const filCol=c=>!hayCol||pegaCol(c);
  const filTal=t=>(!hayTal||pegaTal(t))&&(!fTal||t.id===fTal);
  const filT=k=>!q||pal.every(w=>nm(nomT(k)).includes(w));

  const t=Object.entries(S.terminados).filter(([k,v])=>v.cant!==0&&filT(k));
  const l=Object.entries(S.lisas).filter(([k,v])=>v.cant!==0);
  const bajo=k=>invT(k).cant<=S.stockMin;
  const ap=tmp.apertura||{L:[],T:[]};
  return `
  <div class="card" style="padding:11px">
    <div class="fila">
      <input id="qInv" placeholder="Buscar color, talla o diseño…" value="${esc(q)}"
        oninput="tmp.qInv=this.value;pintarInv()" style="min-height:44px">
      ${q?`<button class="b g chico" style="flex:0 0 auto"
        onclick="tmp.qInv='';pintar()">✕</button>`:''}
    </div>
    ${(()=>{
      const gs={};
      Object.entries(S.terminados).forEach(([k,v])=>{ if(v.cant<=0)return;
        const p=k.split('|'), gk=(usaDis(p[1])?p[0]+'|':'')+p[1];
        gs[gk]=(gs[gk]||0)+v.cant });
      const nomG=x=>{const p=x.split('|');
        return (p.length>1?diseno(p[0]).n+' · ':'')+linea(p.length>1?p[1]:p[0]).n};
      const tals=S.tallas.filter(x=>
        Object.keys(S.lisas).some(k=>k.split('|')[1]===x.id&&S.lisas[k].cant>0)||
        Object.keys(S.terminados).some(k=>k.split('|')[3]===x.id&&S.terminados[k].cant>0));
      const chip=(act,txt,acc)=>`<button onclick="${acc}"
        style="flex:0 0 auto;border:1px solid ${act?'var(--tinta)':'var(--linea)'};
        background:${act?'var(--tinta)':'#fff'};color:${act?'#fff':'var(--texto)'};
        border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer">
        ${txt}</button>`;
      return `
      <div style="display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:4px">
        ${chip(!tmp.fTal,'Todas las tallas',"tmp.fTal='';pintar()")}
        ${tals.map(x=>chip(tmp.fTal===x.id,'T'+esc(x.n),`tmp.fTal='${x.id}';pintar()`)).join('')}
      </div>
      ${Object.keys(gs).length>1?`<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">
        ${chip(!tmp.fDis,'Todos los diseños',"tmp.fDis='';pintar()")}
        ${Object.entries(gs).map(([k,n])=>chip(tmp.fDis===k,
          esc(nomG(k))+' <span style="opacity:.6">'+n+'</span>',`tmp.fDis='${k}';pintar()`)).join('')}
      </div>`:''}`;
    })()}
  </div>

  <div class="card">
    <h3>Cargar el inventario que ya tienes</h3>
    ${!tmp.abrirApertura?`
      <p style="font-size:13px;color:var(--suave);margin:0 0 12px">
        Se usa una sola vez, al arrancar: cuentas físicamente lo que hay en bodega y lo registras
        con su costo. No mueve la caja ni crea deudas, solo deja el inventario en cero real.</p>
      <button class="b n" onclick="tmp.abrirApertura=true;pintar()">Cargar inventario inicial</button>
    `:`
      <label>Fecha del conteo</label><input type="date" id="aFecha" value="${hoy()}">

      <div style="margin-top:16px;padding-top:14px;border-top:2px solid var(--linea)">
        <b style="font-size:14px">1. Camisetas lisas sin estampar</b>
        <div style="font-size:11.5px;color:var(--suave);margin:4px 0 8px">
          Escoge la talla, escribe el costo y llena solo los colores que tengas.</div>
        <div class="g2">
          <select id="aTal">${optTalla()}</select>
          <input id="aCosto" inputmode="numeric" placeholder="Lo que te costó c/u">
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
          gap:8px;margin-top:10px">
          ${S.colores.map(c=>`<label class="swatch">
            <span class="sw-cara" style="background:${c.hex}"></span>
            <span class="sw-nom">${esc(c.n)}</span>
            <input id="aq_${c.id}" inputmode="numeric" placeholder="0"></label>`).join('')}
        </div>
        <button class="b n chico" style="margin-top:8px" onclick="A.addApertura('L')">
          Agregar esta talla</button>
        ${ap.L.map((r,i)=>`<div class="item">
          <div><div class="t">${esc(nomL(r.k))}</div><div class="s cifra">${r.cant} × ${cop(r.cu)}</div></div>
          <div class="m"><button class="b g chico" style="min-height:30px" onclick="A.delApertura('L',${i})">✕</button></div>
        </div>`).join('')}
      </div>

      <div style="margin-top:16px;padding-top:14px;border-top:2px solid var(--linea)">
        <b style="font-size:14px">2. Camisetas ya estampadas</b>
        ${usaDis(tmp.bLin||S.lineas[0].id)&&!S.disenos.length?'<div class="aviso err" style="margin-top:8px">Crea primero los diseños en Ajustes.</div>':''}
        <div class="${usaDis(tmp.bLin||S.lineas[0].id)?'g2':''}" style="margin-top:8px">
          <select id="bLin" onchange="tmp.bLin=this.value;pintar()">${S.lineas.map(x=>
            `<option value="${x.id}"${(tmp.bLin||S.lineas[0].id)===x.id?' selected':''}>${esc(x.n)}</option>`).join('')}</select>
          ${usaDis(tmp.bLin||S.lineas[0].id)?`<select id="bDis">${S.disenos.map(d=>`<option value="${d.id}">${esc(d.n)}</option>`).join('')}</select>`:''}
        </div>
        <div class="g2" style="margin-top:8px">
          <select id="bTal" onchange="tmp.bTal=this.value;pintar()">${optTalla(tmp.bTal)}</select>
          <div class="fila">
            <input id="bCosto" inputmode="numeric" placeholder="Costo real c/u">
            <button class="b g chico" style="flex:0 0 auto" onclick="A.sugerirCosto()">Sugerir</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
          gap:8px;margin-top:10px">
          ${S.colores.map(c=>`<label class="swatch">
            <span class="sw-cara" style="background:${c.hex}"></span>
            <span class="sw-nom">${esc(c.n)}</span>
            <input id="bq_${c.id}" inputmode="numeric" placeholder="0"></label>`).join('')}
        </div>
        <button class="b n chico" style="margin-top:10px" onclick="A.addApertura('T')">
          Agregar esta talla</button>
        <div style="font-size:11.5px;color:var(--suave);margin-top:5px">
          El costo es la lisa más el transfer y la mano de obra, no el precio de venta.
          "Sugerir" lo calcula si ya cargaste esa lisa arriba.</div>
        ${ap.T.map((r,i)=>`<div class="item">
          <div><div class="t">${esc(nomT(r.k))}</div><div class="s cifra">${r.cant} × ${cop(r.cu)}</div></div>
          <div class="m"><button class="b g chico" style="min-height:30px" onclick="A.delApertura('T',${i})">✕</button></div>
        </div>`).join('')}
      </div>

      ${(ap.L.length+ap.T.length)?`<div class="aviso ok" style="margin-top:14px">
        ${num(ap.L.reduce((s,r)=>s+r.cant,0)+ap.T.reduce((s,r)=>s+r.cant,0))} camisetas ·
        ${cop(ap.L.concat(ap.T).reduce((s,r)=>s+r.cant*r.cu,0))} en inventario</div>`:''}
      <button class="b" id="btnApertura" style="margin-top:12px" onclick="A.guardarApertura()">Guardar inventario inicial</button>
      <button class="b g" style="margin-top:8px;background:none;border:0;color:var(--suave)"
        onclick="tmp.abrirApertura=false;pintar()">Cerrar</button>
    `}
  </div>

  <div class="card"><h3>Camisetas estampadas · listas para vender</h3>
    ${t.length?(()=>{
      // Una cuadrícula por diseño y línea: colores en filas, tallas en columnas
      const g={};
      t.forEach(([k,v])=>{
        const p=k.split('|'), gk=(usaDis(p[1])?p[0]+'|':'')+p[1];
        (g[gk]=g[gk]||[]).push([k,v]);
      });
      return Object.entries(g).filter(([gk])=>!fDis||gk===fDis).map(([gk,filas])=>{
        const p=gk.split('|'), lin=p.length>1?p[1]:p[0], dis=p.length>1?p[0]:DGEN;
        const tit=(p.length>1?diseno(p[0]).n+' · ':'')+linea(lin).n;
        const tot=filas.reduce((s,[,v])=>s+v.cant,0);
        const kk=(c,ta)=>kT(dis,lin,c,ta);
        const cols=S.colores.filter(c=>filCol(c)&&S.tallas.some(x=>filTal(x)&&invT(kk(c.id,x.id)).cant>0));
        const tals=S.tallas.filter(x=>filTal(x)&&S.colores.some(c=>filCol(c)&&invT(kk(c.id,x.id)).cant>0));
        if(!cols.length) return '';
        const totC=cid=>tals.reduce((s,x)=>s+invT(kk(cid,x.id)).cant,0);
        const totT=tid=>cols.reduce((s,c)=>s+invT(kk(c.id,tid)).cant,0);
        return `<div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;
            padding:0 0 6px;border-bottom:2px solid var(--linea)">
            <b style="font-size:14px">${esc(tit)}</b>
            <span style="font-size:12px;color:var(--suave)">${tot} und ·
              ${cop(linea(lin).precio)} c/u</span></div>
          <div class="scroll"><table class="malla">
            <tr><th>Color</th>${tals.map(x=>`<th class="n">${esc(x.n)}</th>`).join('')}
              <th class="n">Total</th></tr>
            ${cols.map(c=>`<tr>
              <td style="white-space:nowrap"><span class="punto" style="background:${c.hex}"></span> ${esc(c.n)}</td>
              ${tals.map(x=>{const k=kk(c.id,x.id), q=invT(k).cant;
                if(!q) return '<td class="n"><span style="color:#e4e4e7">·</span></td>';
                return `<td class="n">${admin()
                  ?`<button class="celda" onclick="A.ajustarInv('T','${k}')"
                     style="${bajo(k)?'color:var(--tinta)':''}">${q}</button>`
                  :`<b style="${bajo(k)?'color:var(--tinta)':''}">${q}</b>`}</td>`}).join('')}
              <td class="n"><b>${totC(c.id)}</b></td></tr>`).join('')}
            <tr class="pie"><td>Total</td>
              ${tals.map(x=>`<td class="n">${totT(x.id)}</td>`).join('')}
              <td class="n">${tot}</td></tr>
          </table></div>
        </div>`}).join('')||'<div class="vacio">Nada con ese criterio.</div>';
    })()
      :'<div class="vacio">No hay camisetas estampadas. Registra una producción en Taller.</div>'}
  </div>

  <div class="card"><h3>Camisetas lisas · en bodega</h3>
    ${l.length?(()=>{
      // Tabla: una fila por color, una columna por talla. Solo salen los
      // colores y las tallas que de verdad tienen camisetas.
      const cols=S.colores.filter(c=>filCol(c)&&S.tallas.some(t=>filTal(t)&&invL(kL(c.id,t.id)).cant>0));
      const tals=S.tallas.filter(t=>filTal(t)&&S.colores.some(c=>filCol(c)&&invL(kL(c.id,t.id)).cant>0));
      if(!cols.length) return '<div class="vacio">Nada con ese criterio.</div>';
      const totT=tid=>cols.reduce((s,c)=>s+invL(kL(c.id,tid)).cant,0);
      const totC=cid=>tals.reduce((s,t)=>s+invL(kL(cid,t.id)).cant,0);
      const granTot=cols.reduce((s,c)=>s+totC(c.id),0);
      const granVal=cols.reduce((s,c)=>s+tals.reduce((x,t)=>x+invL(kL(c.id,t.id)).valor,0),0);
      return `<div class="scroll"><table class="malla">
        <tr><th>Color</th>${tals.map(t=>`<th class="n">${esc(t.n)}</th>`).join('')}
          <th class="n">Total</th></tr>
        ${cols.map(c=>`<tr>
          <td style="white-space:nowrap"><span class="punto" style="background:${c.hex}"></span> ${esc(c.n)}</td>
          ${tals.map(t=>{const k=kL(c.id,t.id), q=invL(k).cant;
            const cl=q===0?'c0':(q<=S.stockMin?'cbajo':'');
            return `<td class="n ${cl}">${admin()
              ?`<button class="celda" onclick="A.ajustarInv('L','${k}')">${q}</button>`
              :`<b>${q}</b>`}</td>`}).join('')}
          <td class="n"><b>${totC(c.id)}</b></td></tr>`).join('')}
        <tr class="pie"><td>Total</td>
          ${tals.map(t=>`<td class="n">${totT(t.id)}</td>`).join('')}
          <td class="n">${granTot}</td></tr>
      </table></div>
      <div style="font-size:11.5px;color:var(--suave);margin-top:8px">
        ${admin()?'Toca una cantidad para corregirla. ':''}Valor en bodega:
        <b>${cop(granVal)}</b> ·
        <span style="color:#dc2626">■</span> agotado
        <span style="color:#b45309;margin-left:6px">■</span> ${S.stockMin} o menos</div>
      ${(()=>{
        const cero=[], bajo=[];
        cols.forEach(c=>tals.forEach(t=>{
          const q=invL(kL(c.id,t.id)).cant;
          const txt=c.n+' T'+t.n;
          if(q===0) cero.push(txt); else if(q<=S.stockMin) bajo.push(txt+' ('+q+')');
        }));
        if(!cero.length&&!bajo.length) return '';
        return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--linea)">
          <b style="font-size:12.5px">Para el próximo pedido de lisas</b>
          ${cero.length?`<div style="font-size:12.5px;margin-top:6px">
            <span style="color:#dc2626;font-weight:700">Agotadas:</span> ${esc(cero.join(' · '))}</div>`:''}
          ${bajo.length?`<div style="font-size:12.5px;margin-top:4px">
            <span style="color:#b45309;font-weight:700">Quedan pocas:</span> ${esc(bajo.join(' · '))}</div>`:''}
        </div>`;
      })()}`;
    })()
      :'<div class="vacio">No hay lisas. Registra una compra.</div>'}
  </div>

  <div class="card"><h3>Movimientos por lote</h3>
    ${lotes()}
  </div>`;
}

/* Agrupa el kardex por operación: una carga, una compra, un estampado o
   una venta salen como una sola línea que se abre para ver el detalle. */
const NOMDOC={INICIAL:'Carga inicial',COMPRA:'Compra',PRODUCCION:'Estampado',
  ESTAMPADO:'Estampado al vender',VENTA:'Venta',AJUSTE:'Ajuste',
  ANULACION:'Anulación',DEVOLUCION:'Devolución'};
function lotes(){
  const g=[], idx={};
  S.kardex.slice(0,400).forEach(m=>{
    const key=m.f+'|'+m.doc+'|'+(m.ref||'');
    if(idx[key]==null){ idx[key]=g.length;
      g.push({key,f:m.f,doc:m.doc,ref:m.ref||'',filas:[],ent:0,sal:0}) }
    const L=g[idx[key]]; L.filas.push(m);
    if(m.mov==='SALIDA') L.sal+=m.cant; else L.ent+=m.cant;
  });
  if(!g.length) return '<div class="vacio">Sin movimientos todavía.</div>';
  return g.slice(0,25).map(L=>{
    const ab=(tmp.lote||{})[L.key];
    const refs=new Set(L.filas.map(x=>x.tipo+x.k)).size;
    return `<div class="item" style="display:block">
      <button onclick="A.verLote('${L.key}')" style="border:0;background:none;padding:0;
        width:100%;text-align:left;cursor:pointer;display:flex;justify-content:space-between;
        gap:10px;align-items:baseline">
        <span>
          <span class="t">${ab?'▾':'▸'} ${esc(NOMDOC[L.doc]||L.doc)}</span>
          <span class="s" style="display:block">${fecha(L.f)}${L.ref?' · '+esc(L.ref):''} ·
            ${refs} referencia${refs===1?'':'s'}</span>
        </span>
        <span class="m cifra" style="white-space:nowrap">
          ${L.ent?`<span style="color:var(--ok)">+${L.ent}</span>`:''}
          ${L.ent&&L.sal?' ':''}
          ${L.sal?`<span style="color:var(--tinta)">−${L.sal}</span>`:''}</span>
      </button>
      ${ab?`<div style="background:#faf9fb;border-radius:11px;padding:8px 11px;margin-top:7px">
        <table style="font-size:12.5px">
          ${L.filas.map(m=>`<tr>
            <td>${esc(m.tipo==='L'?nomL(m.k):nomT(m.k))}</td>
            <td class="n" style="white-space:nowrap;color:${m.mov==='SALIDA'?'var(--tinta)':'var(--ok)'}">
              ${m.mov==='SALIDA'?'−':'+'}${m.cant}</td>
            <td class="n" style="color:var(--suave)">quedan ${m.saldo}</td></tr>`).join('')}
        </table>
      </div>`:''}
    </div>`}).join('');
}

/* Parrilla rápida: un grupo (diseño+línea) a la vez, colores en filas y
   tallas en columnas. Un toque suma una al carrito.                     */
function parrilla(){
  const tv=tmp.tipoVenta||'DETAL';
  const hay=Object.entries(S.terminados).filter(([k,v])=>v.cant>0);
  if(!hay.length) return '<div class="vacio">No hay camisetas estampadas.</div>';

  const grupos={};
  hay.forEach(([k])=>{const p=k.split('|');
    grupos[p[0]+'|'+p[1]]=(grupos[p[0]+'|'+p[1]]||0)+invT(k).cant});
  const claves=Object.keys(grupos);
  let g=tmp.grupo&&grupos[tmp.grupo]?tmp.grupo:claves[0];
  const [gd,gl]=g.split('|');
  const nombre=x=>{const [d,l]=x.split('|');
    return (usaDis(l)?diseno(d).n+' · ':'')+linea(l).n};

  const enCarrito=k=>((tmp.carrito||[]).find(c=>c.id===k)||{}).cant||0;
  const cols=S.colores.filter(c=>S.tallas.some(t=>invT(kT(gd,gl,c.id,t.id)).cant>0));
  const tals=S.tallas.filter(t=>S.colores.some(c=>invT(kT(gd,gl,c.id,t.id)).cant>0));

  return `
  <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px">
    ${claves.map(x=>`<button onclick="tmp.grupo='${x}';pintar()"
      style="flex:0 0 auto;border:1px solid ${x===g?'var(--tinta)':'var(--linea)'};
      background:${x===g?'var(--tinta)':'#fff'};color:${x===g?'#fff':'var(--texto)'};
      border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer">
      ${esc(nombre(x))} <span style="opacity:.65">${grupos[x]}</span></button>`).join('')}
  </div>
  <div style="font-size:12px;color:var(--suave);margin-bottom:6px">
    Toca una casilla para sumar una · ${cop(precioPor(gl,1,tv))} c/u</div>
  <div class="scroll"><table class="malla">
    <tr><th>Color</th>${tals.map(t=>`<th class="n">${esc(t.n)}</th>`).join('')}</tr>
    ${cols.map(c=>`<tr>
      <td style="white-space:nowrap"><span class="punto" style="background:${c.hex}"></span> ${esc(c.n)}</td>
      ${tals.map(t=>{const k=kT(gd,gl,c.id,t.id), v=invT(k).cant, y=enCarrito(k);
        if(!v) return '<td class="n"><span style="color:#e4e4e7">·</span></td>';
        return `<td class="n"><button class="celda" onclick="A.agregar('${k}')"
          style="${y?'background:var(--tinta);color:#fff':''}">${y?y+'/'+v:v}</button></td>`}).join('')}
    </tr>`).join('')}
  </table></div>`;
}
function pintarLista(){
  const q=(tmp.busq||'').toLowerCase();
  const cont=$('listaProd'); if(!cont)return;
  const tv=tmp.tipoVenta||'DETAL';
  if(!q&&tmp.parrilla!==false){ cont.innerHTML=`<div style="grid-column:1/-1">${parrilla()}</div>`; return }
  const lista=Object.entries(S.terminados).filter(([k,v])=>v.cant>0)
    .filter(([k])=>!q||nomT(k).toLowerCase().includes(q));
  cont.innerHTML=lista.length?lista.map(([k,v])=>{
    const p=k.split('|');
    return `<button class="prod" onclick="A.agregar('${k}')">
      <div><span class="punto" style="background:${color(p[2]).hex}"></span>
        ${usaDis(p[1])?`<span class="tag">${esc(linea(p[1]).n)}</span>`:''}</div>
      <div style="font-weight:700;font-size:14px;margin-top:5px;line-height:1.2">${esc(usaDis(p[1])?diseno(p[0]).n:linea(p[1]).n)}</div>
      <div style="font-size:12px;color:var(--suave)">${esc(color(p[2]).n)} · Talla ${esc(talla(p[3]).n)}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:7px">
        <b class="cifra">${cop(precioPor(p[1],1,tv))}</b>
        <span class="cifra" style="font-size:12px;color:var(--suave)">${v.cant} und</span></div></button>`}).join('')

}

/* ── Pedidos ────────────────────────────────────────────── */
function vPedidos(){
  const ped=tmp.ped||[];
  const lSel=tmp.qLin||S.lineas[0].id;

  const cerrados=S.pedidos.filter(p=>p.estado==='ENTREGADO'||p.estado==='CANCELADO');
  const h=hoy();

  const tarjeta=p=>{
    const und=p.items.reduce((s,r)=>s+r.cant,0);
    const listo=p.items.every(r=>invT(r.k).cant>=r.cant);
    const tarde=p.entrega&&p.entrega<h&&p.estado!=='ENTREGADO';
    return `<div style="border:1px solid ${tarde?'var(--tinta)':'var(--linea)'};
      border-radius:14px;padding:12px;margin-bottom:10px">

          <b style="font-size:15px">${esc(p.nom||cliente(p.cliente).n)}</b>

/* Muestra, mientras armas el pedido, qué tienes de esa referencia */
function pistaPedido(){
  const e=document.getElementById('qPista'); if(!e)return;
  const l=val('qLin'), d=usaDis(l)?val('qDis'):DGEN;
  const c=val('qCol'), t=val('qTal'), q=nval('qCant')||1;
  if(!l||!c||!t){ e.innerHTML=''; return }
  const hechas=invT(kT(d,l,c,t)).cant, lisas=invL(kL(c,t)).cant;
  if(hechas>=q){
    e.innerHTML=`<span style="color:var(--ok)">✓ Ya tienes ${hechas} estampada${
      hechas===1?'':'s'} de esa</span>`;
  }else{
    const falta=q-hechas;
    e.innerHTML=`<span style="color:var(--tinta)">Hay ${hechas} estampada${hechas===1?'':'s'} ·
      habría que estampar ${falta}</span> <span style="color:var(--suave)">·
      lisas ${esc(color(c).n)} T${esc(talla(t).n)}: <b>${lisas}</b>${
      lisas<falta?' (no alcanzan)':''}</span>`;
  }
}
window.pistaPedido=pistaPedido;

/* ── Cartera ────────────────────────────────────────────── */
function vCartera(){
  const h=hoy();
  const deb=S.facturas.filter(f=>f.saldo>0&&f.estado!=='ANULADA')
    .sort((a,b)=>(a.limite||'9999').localeCompare(b.limite||'9999'));
  const total=deb.reduce((s,f)=>s+f.saldo,0);
  const venc=deb.filter(f=>f.limite&&f.limite<h);
  return `
  <div class="g2" style="margin-bottom:12px">
    <div class="kpi"><div class="et">Total por cobrar</div><div class="v cifra">${cop(total)}</div>
      <div class="d">${deb.length} facturas</div></div>
    <div class="kpi"><div class="et">Vencido</div><div class="v cifra" style="color:var(--tinta)">${cop(venc.reduce((s,f)=>s+f.saldo,0))}</div>
      <div class="d">${venc.length} facturas</div></div>
  </div>
  <div class="card"><h3>Quién debe</h3>
    ${deb.length?deb.map(f=>{

          <div class="s">${f.nro} · ${fecha(f.f)}${f.limite?' · vence '+fecha(f.limite):''}

}
