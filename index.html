/* ── Reportes ───────────────────────────────────────────── */
function vReportes(){
  const d=tmp.rDesde||hoy().slice(0,8)+'01', ha=tmp.rHasta||hoy();
  const fs=S.facturas.filter(f=>f.estado!=='ANULADA'&&f.f>=d&&f.f<=ha);
  const gs=S.gastos.filter(g=>g.f>=d&&g.f<=ha);
  const cs=S.compras.filter(c=>c.f>=d&&c.f<=ha);
  const os=S.ordenes.filter(o=>o.estado!=='ANULADA'&&o.f>=d&&o.f<=ha);
  const venta=fs.reduce((s,f)=>s+f.total,0);
  const costo=fs.reduce((s,f)=>s+f.costo,0);
  const gasto=gs.reduce((s,g)=>s+g.monto,0);

  const porProd={}, porLinea={};
  fs.forEach(f=>f.det.forEach(x=>{
    const p=porProd[x.k]||(porProd[x.k]={u:0,v:0,c:0});
    p.u+=x.cant; p.v+=x.neto; p.c+=x.costo;
    const l=x.k.split('|')[1];
    const q=porLinea[l]||(porLinea[l]={u:0,v:0,c:0});
    q.u+=x.cant; q.v+=x.neto; q.c+=x.costo;
  }));

  /* ── Análisis: qué se vende más ──────────────────────────
     El filtro de línea deja ver, por ejemplo, solo las Premium. */
  const lFil=tmp.rLin||'';
  const acum=(campo)=>{
    const m={};
    fs.forEach(f=>f.det.forEach(x=>{
      const p=x.k.split('|');
      if(lFil&&p[1]!==lFil) return;
      const key=campo==='c'?p[2]:campo==='t'?p[3]:campo==='d'?p[0]:p[1];
      const a=m[key]||(m[key]={u:0,v:0,c:0});
      a.u+=x.cant; a.v+=x.neto; a.c+=x.costo;
    }));
    return Object.entries(m).sort((a,b)=>b[1].u-a[1].u);
  };
  const porTipo={};
  fs.forEach(f=>{
    const k=f.tipo||'DETAL';
    const a=porTipo[k]||(porTipo[k]={n:0,u:0,v:0,c:0});
    a.n++; a.u+=f.det.reduce((s,x)=>s+x.cant,0); a.v+=f.total; a.c+=f.costo;
  });
  const undTot=fs.reduce((s,f)=>s+f.det.reduce((x,d)=>x+d.cant,0),0);

  const rank=(titulo,datos,nombre)=>{
    const max=datos.length?datos[0][1].u:0;
    return `<div class="card"><h3>${titulo}</h3>
      ${datos.length?datos.slice(0,12).map(([k,x],i)=>`
        <div style="padding:7px 0;border-bottom:1px solid #f4f4f5">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
            <div style="font-size:14px;font-weight:${i<3?'700':'500'}">
              <span style="color:var(--suave);font-size:12px">${i+1}.</span> ${nombre(k)}</div>
            <div style="white-space:nowrap;font-size:13px">
              <b class="cifra">${x.u}</b> <span style="color:var(--suave);font-size:11.5px">und</span>
              <span class="cifra" style="color:var(--suave);margin-left:7px">${cop(x.v)}</span></div>
          </div>
          <div style="height:5px;background:#f2eff5;border-radius:9px;margin-top:5px;overflow:hidden">
            <div style="height:100%;width:${max?Math.round(x.u/max*100):0}%;
              background:${i===0?'var(--tinta)':i<3?'#e879b0':'#dcd6e2'}"></div></div>
        </div>`).join('')
        :'<div class="vacio">Sin ventas en el periodo</div>'}
    </div>`;
  };

  return `
  <div class="card"><h3>Periodo</h3>
    <div class="g2">
      <div><label>Desde</label><input type="date" value="${d}" onchange="tmp.rDesde=this.value;pintar()"></div>
      <div><label>Hasta</label><input type="date" value="${ha}" onchange="tmp.rHasta=this.value;pintar()"></div>
    </div>
  </div>

  <div class="card"><h3>Estado de resultados</h3>
    <div class="item"><div class="t">Ventas</div><div class="m cifra">${cop(venta)}</div></div>
    <div class="item"><div class="t">Costo de la mercancía</div><div class="m cifra">−${cop(costo)}</div></div>
    <div class="item"><div class="t"><b>Utilidad bruta</b></div>
      <div class="m cifra"><b>${cop(venta-costo)}</b>
        <div class="s">${venta?((venta-costo)/venta*100).toFixed(1):0}% de margen</div></div></div>
    <div class="item"><div class="t">Gastos</div><div class="m cifra">−${cop(gasto)}</div></div>
    <div class="item"><div class="t"><b>Utilidad neta</b></div>
      <div class="m cifra" style="font-size:18px"><b>${cop(venta-costo-gasto)}</b></div></div>
  </div>

  <div class="card"><h3>Utilidad por línea</h3>
    <div class="scroll"><table>
      <tr><th>Línea</th><th class="n">Und</th><th class="n">Venta</th><th class="n">Utilidad</th><th class="n">%</th></tr>
      ${Object.entries(porLinea).map(([l,x])=>`<tr><td>${esc(linea(l).n)}</td>
        <td class="n">${x.u}</td><td class="n">${cop(x.v)}</td><td class="n">${cop(x.v-x.c)}</td>
        <td class="n">${x.v?((x.v-x.c)/x.v*100).toFixed(0):0}%</td></tr>`).join('')
        ||'<tr><td colspan="5" style="color:#999">Sin ventas en el periodo</td></tr>'}
    </table></div>
  </div>

  <div class="card"><h3>¿Qué se vende más?</h3>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">
      ${[['','Todo']].concat(S.lineas.map(l=>[l.id,l.n])).map(([v,n])=>`
        <button onclick="tmp.rLin='${v}';pintar()"
          style="flex:0 0 auto;border:1px solid ${lFil===v?'var(--tinta)':'var(--linea)'};
          background:${lFil===v?'var(--tinta)':'#fff'};color:${lFil===v?'#fff':'var(--texto)'};
          border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer">
          ${esc(n)}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--suave);margin-top:8px">
      ${lFil?'Viendo solo '+esc(linea(lFil).n):'Viendo todas las líneas'} ·
      ${undTot} camisetas vendidas en el periodo</div>
  </div>

  ${rank('Colores más vendidos',acum('c'),k=>
    `<span class="punto" style="background:${color(k).hex}"></span> ${esc(color(k).n)}`)}

  ${rank('Tallas más vendidas',acum('t'),k=>'Talla '+esc(talla(k).n))}

  ${S.disenos.length?rank('Diseños más vendidos',acum('d'),k=>esc(diseno(k).n)):''}

  <div class="card"><h3>¿Cómo vendes más?</h3>
    <div class="scroll"><table>
      <tr><th>Modo</th><th class="n">Facturas</th><th class="n">Und</th>
        <th class="n">Venta</th><th class="n">% del total</th><th class="n">Margen</th></tr>
      ${Object.entries(porTipo).sort((a,b)=>b[1].v-a[1].v).map(([k,x])=>`<tr>
        <td><b>${k==='DETAL'?'Detal':k==='MAYOR'?'Por mayor':'Pack x3'}</b></td>
        <td class="n">${x.n}</td><td class="n">${x.u}</td>
        <td class="n">${cop(x.v)}</td>
        <td class="n">${venta?(x.v/venta*100).toFixed(0):0}%</td>
        <td class="n">${x.v?((x.v-x.c)/x.v*100).toFixed(0):0}%</td></tr>`).join('')
        ||'<tr><td colspan="6" style="color:#999">Sin ventas en el periodo</td></tr>'}
    </table></div>
    <div style="font-size:12px;color:var(--suave);margin-top:8px">
      El margen dice cuánto te deja cada modo. Si el pack deja mucho menos que el detal,
      ahí tienes dónde ajustar el precio.</div>
  </div>

  <div class="card"><h3>Utilidad por producto</h3>
    <div class="scroll"><table>
      <tr><th>Producto</th><th class="n">Und</th><th class="n">Venta</th><th class="n">Utilidad</th></tr>
      ${Object.entries(porProd).sort((a,b)=>(b[1].v-b[1].c)-(a[1].v-a[1].c)).map(([k,x])=>
        `<tr><td>${esc(nomT(k))}</td><td class="n">${x.u}</td>
         <td class="n">${cop(x.v)}</td><td class="n">${cop(x.v-x.c)}</td></tr>`).join('')
        ||'<tr><td colspan="4" style="color:#999">Sin ventas en el periodo</td></tr>'}
    </table></div>
    <button class="b g chico" style="margin-top:10px;width:100%" onclick="A.csv('utilidad-productos',
      [['Producto','Unidades','Venta','Costo','Utilidad']].concat(${JSON.stringify(
        Object.entries(porProd).map(([k,x])=>[nomT(k),x.u,Math.round(x.v),Math.round(x.c),Math.round(x.v-x.c)]))}))">
      Descargar Excel (CSV)</button>
  </div>

  <div class="card"><h3>Resumen del periodo</h3>
    <div class="item"><div class="t">Compras de lisas</div>
      <div class="m cifra">${cop(cs.reduce((s,c)=>s+c.total,0))}<div class="s">${cs.length} compras</div></div></div>
    <div class="item"><div class="t">Producción</div>
      <div class="m cifra">${num(os.reduce((s,o)=>s+o.buenas,0))} und
        <div class="s">${num(os.reduce((s,o)=>s+o.merma,0))} dañadas</div></div></div>
    <div class="item"><div class="t">Facturas emitidas</div><div class="m cifra">${fs.length}</div></div>
    <div class="item"><div class="t">Ticket promedio</div>
      <div class="m cifra">${cop(fs.length?venta/fs.length:0)}</div></div>
  </div>

  <div class="card"><h3>Libro diario</h3>
    <div class="scroll"><table>
      <tr><th>Fecha</th><th>Concepto</th><th>Cuenta</th><th class="n">Débito</th><th class="n">Crédito</th></tr>
      ${S.asientos.filter(a=>a.f>=d&&a.f<=ha).slice(0,60).flatMap(a=>
        a.lineas.map((l,i)=>`<tr><td>${i===0?fecha(a.f):''}</td><td>${i===0?esc(a.concepto):''}</td>
        <td>${esc(l.cuenta)}</td><td class="n">${l.d?cop(l.d):''}</td>
        <td class="n">${l.c?cop(l.c):''}</td></tr>`)).join('')
        ||'<tr><td colspan="5" style="color:#999">Sin movimientos contables</td></tr>'}
    </table></div>
  </div>`;
}

/* ── Ajustes ────────────────────────────────────────────── */
function listaEdit(titulo,lista,campo){
  return `<div class="card"><h3>${titulo}</h3>
    ${lista==='colores'?`<button class="b g chico" style="margin-bottom:10px"
      onclick="A.cargarGama()">Completar la gama de 16 colores</button>`:''}
    ${S[lista].map((x,i)=>`<div class="item"><div class="t">${
      lista==='colores'?`<span class="punto" style="background:${x.hex}"></span> `:''}${esc(x.n)}</div>
      <div class="m"><button class="b g chico" style="min-height:30px" onclick="A.delCat('${lista}',${i})">✕</button></div></div>`).join('')
      ||'<div class="vacio">Vacío</div>'}
    <div class="fila" style="margin-top:10px">
      <input id="${campo}" placeholder="Agregar nuevo">
      <button class="b n chico" style="flex:0 0 auto" onclick="A.addCat('${lista}','${campo}')">Agregar</button>
    </div></div>`;
}
function vAjustes(){
  return `

    ${S.lineas.map((L,i)=>`

        <label>Nombre</label><input id="ln${i}" value="${esc(L.n)}">
        <div class="g3">
          <div><label>Detal</label><input id="lp${i}" inputmode="numeric" value="${L.precio}"></div>
          <div><label>Transfer c/u</label><input id="le${i}" inputmode="numeric" value="${L.estampado}"></div>
          <div><label>Margen mín %</label><input id="lm${i}" inputmode="numeric" value="${L.margenMin}"></div>
        </div>
        <label>Precio al por mayor según cantidad</label>
        <div class="g3">
          <div><input id="r${i}a" inputmode="numeric" value="${L.rangos[0].p}" placeholder="1-5"></div>
          <div><input id="r${i}b" inputmode="numeric" value="${L.rangos[1].p}" placeholder="6-20"></div>
          <div><input id="r${i}c" inputmode="numeric" value="${L.rangos[2].p}" placeholder="21+"></div>
        </div>
        <div style="font-size:11px;color:var(--suave);margin-top:4px">1 a 5 · 6 a 20 · 21 o más</div>
        <div class="g2">
          <div><label>Camisetas por pack</label><input id="pu${i}" inputmode="numeric" value="${L.pack.und}"></div>
          <div><label>Precio del pack</label><input id="pp${i}" inputmode="numeric" value="${L.pack.precio}"></div>
        </div>
        <div style="font-size:11px;color:var(--suave);margin-top:4px">
          Queda en ${cop(L.pack.precio/L.pack.und)} por camiseta</div>
        <label style="display:flex;align-items:center;gap:9px;text-transform:none;font-size:13.5px;
          letter-spacing:0;color:var(--texto);margin:10px 0 0;background:#fafafa;
          border-radius:10px;padding:9px 11px">
          <input type="checkbox" id="ld${i}" style="width:auto;min-height:auto"${L.usaDis?' checked':''}>
          Controlar el diseño de cada camiseta</label>
        <div style="font-size:11.5px;color:var(--suave);margin-top:4px">
          Apagado: solo color y talla. Encendido: pide el diseño (Hot Wheels, Spiderman…)
          y el inventario se separa modelo por modelo.</div>
      </div>`).join('')}
    <div class="g2" style="margin-top:10px">
      <div><label>Alerta de stock bajo</label><input id="stockMin" inputmode="numeric" value="${S.stockMin}"></div>
      <div><label>Nombre del negocio</label><input id="eNom" value="${esc(S.empresa.nombre)}"></div>
    </div>
    <div class="g2">
      <div><label>Teléfono</label><input id="eTel" value="${esc(S.empresa.tel)}"></div>
      <div><label>NIT</label><input id="eNit" value="${esc(S.empresa.nit)}"></div>
    </div>
    <button class="b" style="margin-top:12px" onclick="A.guardarPrecios()">Guardar</button>
  </div>

  ${listaEdit('Diseños','disenos','nDis')}
  ${listaEdit('Clientes','clientes','nCli')}
  ${listaEdit('Colores','colores','nCol')}
  ${listaEdit('Tallas','tallas','nTal')}
  ${listaEdit('Proveedores','proveedores','nProv')}
  ${listaEdit('Cuentas de dinero','cuentas','nCue')}

  <div class="card"><h3>Respaldo</h3>
    <p style="font-size:13px;color:var(--suave);margin:0 0 12px">
      Todo se guarda en este teléfono. Si borras el navegador o cambias de equipo, pierdes los datos.
      Descarga un respaldo cada semana y guárdalo en Drive o WhatsApp.</p>
    <button class="b n" onclick="A.exportar()">Descargar respaldo</button>
    <div style="font-size:12.5px;color:var(--suave);margin-top:12px;padding-top:12px;
      border-top:1px solid var(--linea)">
      Conectado como <b>${esc(yo.nombre)}</b> (${yo.rol==='ADMIN'?'administrador':'vendedor'}).
      Los datos están en Firebase, no en este teléfono.
    </div>
  </div>

  ${admin()?`<div class="card" style="border:1px solid var(--tinta)">
    <h3 style="color:var(--tinta)">Empezar de cero</h3>
    <p style="font-size:13px;color:var(--suave);margin:0 0 12px">
      Borra todas las facturas, compras, producciones, gastos, movimientos de caja
      y el inventario completo. Los colores, tallas, diseños, clientes y precios se quedan.
      Úsalo una sola vez, cuando termines de hacer pruebas.
      <b>Descarga primero el respaldo de arriba.</b></p>
    <button class="b" style="background:var(--tinta)" onclick="A.empezarCero()">Borrar todos los movimientos</button>
  </div>`:''}`;
}

/* Repinta solo el cuerpo y devuelve el cursor al buscador de inventario */
function pintarInv(){
  const e=$('qInv'); const pos=e?e.selectionStart:0;
  pintar();
  const n=$('qInv'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){} }
}
window.pintarInv=pintarInv;
window.cop=cop;

/* ═══════════ PINTAR ═════════════════════════════════════ */
/* El vendedor no ve costos, utilidad, compras, reportes ni ajustes.
   Ojo: esto es para el día a día, no es una caja fuerte. Alguien con
   conocimientos técnicos podría ver los datos que le llegan al navegador.
   Si eso te preocupa, hay que separar los costos en otra colección.      */
const SOLO_ADMIN=['compras','reportes','ajustes','caja'];

function pintar(){
  if(!yo||!S) return;
  const visibles=TABS.filter(t=>admin()||!SOLO_ADMIN.includes(t.k));
  if(!visibles.find(t=>t.k===tab)) tab='inicio';
  $('nav').innerHTML=visibles.map(t=>
    `<button class="${tab===t.k?'on':''}" onclick="ir('${t.k}')"><span>${t.i}</span>${t.n}</button>`).join('');
  $('hsub').textContent=({inicio:'Resumen del negocio',vender:'Punto de venta',inventario:'Bodega',
    taller:'Estampado',compras:'Compras',facturas:'Ventas emitidas',cartera:'Quién debe',
    caja:'Dinero',reportes:'Números',ajustes:'Configuración',
    pedidos:'Encargos por entregar'})[tab]||'';
  const cuerpo={inicio:vInicio,vender:vVender,inventario:vInventario,taller:vTaller,compras:vCompras,
    facturas:vFacturas,cartera:vCartera,caja:vCaja,reportes:vReportes,ajustes:vAjustes,
    pedidos:vPedidos}[tab];
  $('vista').innerHTML=cuerpo();
  pintarMsg();
  if(document.getElementById('qPista')) pistaPedido();
}

/* ═══════════ ENTRAR ═════════════════════════════════════ */
function pantallaLogin(error){
  $('login').style.display='flex';
  $('app').style.display='none';
  $('login').innerHTML=`<div style="width:100%;max-width:360px">
    <h1 style="color:#fff;font-size:30px;letter-spacing:-.02em;margin:0">EMMANUKIDS</h1>
    <p style="color:#a1a1aa;font-size:13px;margin:4px 0 24px">Compras · Taller · Ventas · Caja</p>
    <div style="background:#fff;border-radius:18px;padding:18px">
      <label>Correo</label><input id="lMail" type="email" autocomplete="username">
      <label>Contraseña</label><input id="lPass" type="password" autocomplete="current-password">
      ${error?`<div class="aviso err" style="margin:12px 0 0">${esc(error)}</div>`:''}
      <button class="b" style="margin-top:14px" id="lBtn">Entrar</button>
    </div></div>`;
  const entrar=async()=>{
    $('lBtn').disabled=true; $('lBtn').textContent='Entrando…';
    try{ await signInWithEmailAndPassword(auth,val('lMail').trim(),val('lPass')) }
    catch(e){ pantallaLogin(
      /password|credential|invalid/i.test(e.code||'')?'Correo o contraseña incorrectos':
      'No se pudo conectar. Revisa el internet.') }
  };
  $('lBtn').onclick=entrar;
  $('lPass').onkeydown=e=>{ if(e.key==='Enter') entrar() };
}

onAuthStateChanged(auth,async u=>{
  if(!u){ yo=null; S=null; return pantallaLogin() }
  let perfil={};
  try{ const p=await getDoc(doc(db,'usuarios',u.uid)); if(p.exists()) perfil=p.data() }catch(e){}
  yo={uid:u.uid,nombre:perfil.nombre||u.email.split('@')[0],rol:perfil.rol||'VENDEDOR'};
  $('login').style.display='none';
  $('app').style.display='block';
  $('quien').textContent=yo.nombre;
  try{ if(yo.rol==='ADMIN') await sembrar() }catch(e){}
  escuchar();
});

/* Los botones del HTML llaman estas funciones, así que van al ámbito global */
Object.assign(window,{A,ir,tmp,pintar,pintarLista,pintarSoloCosto});
