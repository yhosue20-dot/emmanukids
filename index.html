<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMMATSHIRT · Local</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --card:#fff; --ink:#2B2340; --mut:#8A8299; --line:#EFE6DA;
  --pink:#FF5FA2; --yellow:#FFC93C; --blue:#3DB2FF; --green:#2EC77A; --purple:#8C6CFF; --red:#FF5A5A;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
header{padding:16px 18px 6px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}
.logo span:nth-child(1){color:var(--pink)}.logo span:nth-child(2){color:var(--yellow)}.logo span:nth-child(3){color:var(--blue)}.logo span:nth-child(4){color:var(--green)}
.status{font-size:12px;color:var(--mut)}
main{padding:6px 14px 20px;max-width:720px;margin:0 auto}
h2{font-size:18px;margin:18px 4px 10px;font-weight:900}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 0 var(--line);margin-bottom:12px}
.big{font-size:30px;font-weight:900;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{border:0;border-radius:var(--r);padding:16px 8px;color:#fff;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.act:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.act .ic{font-size:26px}
.a-sell{background:var(--pink)}.a-stamp{background:var(--purple)}.a-in{background:var(--blue)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{background:var(--bg);border-radius:99px;padding:5px 10px;font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.tabs button .ic{font-size:20px}
.tabs button.on{color:var(--ink);background:var(--bg)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap;font-weight:800}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.tw{overflow-x:auto;border-radius:12px}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:800}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#fff;padding-left:4px;min-width:110px;max-width:150px;white-space:normal;line-height:1.2}
td.q{cursor:pointer;font-weight:900}
td.q.z{color:#CFC6BA;font-weight:700}
td.q.low{color:var(--red)}
td.tot{color:var(--mut)}
tr.grp td{background:var(--bg);font-weight:900;font-size:14px;padding:8px 6px;position:static;max-width:none;border-bottom:0}
.col{padding-left:12px;color:var(--mut)}
.mov{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border:0}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;color:#fff;font-weight:900;margin-right:6px}
.t-venta{background:var(--pink)}.t-estampado{background:var(--purple)}.t-entrada{background:var(--blue)}.t-ajuste{background:var(--mut)}.t-anulada{background:#bbb}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;background:var(--ink);color:#fff;width:100%;font-size:16px}
.btn.sec{background:var(--bg);color:var(--ink)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn.danger{background:#FFE5E5;color:var(--red)}
.btn:disabled{opacity:.4}
label{display:block;font-size:13px;color:var(--mut);margin:12px 2px 6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;min-width:46px;font-weight:800}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip small{display:block;font-size:10px;opacity:.7;font-weight:700}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);font-size:22px;font-weight:900}
.step input{text-align:center;width:80px}
.ov{position:fixed;inset:0;background:rgba(43,35,64,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:900}
.cart{background:var(--bg);border-radius:14px;padding:4px 12px;margin-top:12px}
.ci{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ci:last-child{border:0}
.ci .p{width:96px}
.ci .p input{padding:6px 8px;font-size:14px}
.x{border:0;background:none;font-size:18px;color:var(--mut)}
.warn{color:var(--red);font-size:13px;margin-top:6px}
.hint{background:#FFF3C9;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;display:none}
.empty{text-align:center;color:var(--mut);padding:18px 6px;font-size:14px}
.cfgline{display:grid;grid-template-columns:1fr 76px 76px 76px;gap:6px;align-items:center;margin-bottom:6px}
.cfgline input{padding:8px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="logo"><span>E</span><span>M</span><span>M</span><span>A</span>TSHIRT</div>
  <div class="status" id="status">Conectando…</div>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="inicio" class="on"><span class="ic">🏠</span>Inicio</button>
  <button data-tab="local"><span class="ic">👕</span>Local</button>
  <button data-tab="taller"><span class="ic">🧵</span>Taller</button>
  <button data-tab="ventas"><span class="ic">💰</span>Ventas</button>
  <button data-tab="caja"><span class="ic">💵</span>Caja</button>
  <button data-tab="ajustes"><span class="ic">⚙️</span>Ajustes</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
// ====== PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO FIREBASE ======
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAQB7LmzskNcajuX_EzkD_DzF35_CrhcCE",
  authDomain: "emmakids-2bc21.firebaseapp.com",
  projectId: "emmakids-2bc21",
  storageBucket: "emmakids-2bc21.firebasestorage.app",
  messagingSenderId: "407227021780",
  appId: "1:407227021780:web:45e620e0d1c1d8e1d7be41"
};
// ================================================================

// ---------- Config por defecto (se guarda en Ajustes) ----------
const DEFAULT_CFG = {
  tallas: ["2","4","6","8","10","12","14","16"],
  colores: ["Blanco","Negro","Gris","Rosado","Azul cielo","Amarillo"],
  disenosVibe: [],
  lineas: [
    {id:"graphic", nombre:"Graphic", porDiseno:true, disenos:[], detal:38000, mayor:29000},
    {id:"vibe", nombre:"Vibe", porDiseno:true, disenos:[], detal:48000, mayor:37000},
    {id:"oversize", nombre:"Oversize Girls", porDiseno:false, disenos:[], detal:38000, mayor:29000}
  ],
  metodos: ["Efectivo","Transferencia","Nequi","99 Envíos"],
  alertaMin: 2
};

const S = { caja:null, db:null, cfg:JSON.parse(JSON.stringify(DEFAULT_CFG)), stock:{}, movs:[], tab:"inicio", lineaSel:"graphic", fecha:hoy(), ready:false };

// ---------- Utilidades ----------
function hoy(d=new Date()){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
const $ = s=>document.querySelector(s);
const money = n => "$" + Math.round(n||0).toLocaleString("es-CO");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"_");
const keyOf = (ubic,linea,v,t,c) => [ubic, linea||"lisa", slug(v), ...(c?[slug(c)]:[]), slug(t)].join("__");
const qtyOf = (ubic,linea,v,t,c) => (S.stock[keyOf(ubic,linea,v,t,c)]||{}).qty||0;
const nom = i => (i.linea&&i.linea!=="lisa" ? linea(i.linea).nombre+" · " : "Lisa ") + i.v + (i.c?" "+i.c:"");
const linea = id => S.cfg.lineas.find(l=>l.id===id) || S.cfg.lineas[0];
const varsDe = l => l.porDiseno ? (l.disenos||[]) : S.cfg.colores;
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2200); }
function fechaDe(ts){ return hoy(new Date(ts)); }
function horaDe(ts){ return new Date(ts).toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}); }
function docsOf(snap){ const arr = snap && (snap.docs || snap) || []; return Array.from(arr).map(d=>({id:d.id, ...(typeof d.data==="function"?d.data():d)})); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ---------- Base de datos ----------
async function writeStock(changes){
  for(const c of changes){
    const k = keyOf(c.ubic,c.linea,c.v,c.t,c.c);
    const cur = (S.stock[k]||{}).qty||0;
    const rec = {ubic:c.ubic, linea:c.linea||"lisa", v:c.v, t:c.t, qty: c.set!=null ? c.set : cur + c.delta};
    if(c.c) rec.c = c.c;
    S.stock[k] = rec;
    await S.db.collection("local_stock").doc(k).set(rec);
  }
}
async function addMov(m){ m.ts = Date.now(); m.fecha = fechaDe(m.ts); const id=uid(); await S.db.collection("local_movs").doc(id).set(m); return id; }

let unsubs=[];
function init(){
  render();
  if(FIREBASE_CONFIG.apiKey==="PEGAR_AQUI"){ $("#status").textContent="Falta configurar Firebase"; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    unsubs.forEach(f=>f()); unsubs=[];
    if(!u){ S.db=null; S.ready=false; $("#status").textContent="Sin sesión"; openLogin(); return; }
    closeSheet(); S.db = db; $("#status").textContent="Cargando…";
    unsubs.push(db.doc("local_config/caja").onSnapshot(s=>{ S.caja = s.exists ? s.data() : null; render(); }));
    unsubs.push(db.doc("local_config/main").onSnapshot(s=>{
      const d = s.exists ? s.data() : null;
      if(d && d.tallas){ S.cfg = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)), d);
        S.cfg.lineas.forEach(l=>{ if(!l.disenos) l.disenos=[]; }); }
      render();
    }));
    unsubs.push(db.collection("local_stock").onSnapshot({includeMetadataChanges:true}, s=>{
      const m={}; s.docs.forEach(d=>{ m[d.id]={id:d.id,...d.data()}; }); S.stock=m;
      S.ready=true; $("#status").textContent = s.metadata.fromCache ? "● Sin internet (guardando local)" : "● En línea"; render();
    }, e=>{ $("#status").textContent="Error: "+e.code; }));
    unsubs.push(db.collection("local_movs").orderBy("ts","desc").limit(1000).onSnapshot(s=>{
      S.movs = s.docs.map(d=>({id:d.id,...d.data()})); render();
    }));
  });
}
function openLogin(){
  openSheet(`<h3>🔒 Entrar</h3><div class="mut">EMMATSHIRT · Local</div>
    <label>Correo</label><input type="text" id="lg-e" autocomplete="username" inputmode="email">
    <label>Contraseña</label><input type="password" id="lg-p" autocomplete="current-password" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px">
    <div id="lg-err" class="warn"></div><div style="height:14px"></div>
    <button class="btn" onclick="doLogin()">Entrar</button>`);
}
async function doLogin(){
  try{ await firebase.auth().signInWithEmailAndPassword($("#lg-e").value.trim(), $("#lg-p").value); }
  catch(e){ $("#lg-err").textContent = "No se pudo entrar: revisa correo y contraseña."; }
}
async function importar(file){
  if(!S.db) return toast("Entra primero");
  try{
    const data = JSON.parse(await file.text());
    const ops = [["local_config/main", data.config]];
    Object.entries(data.stock||{}).forEach(([k,v])=>ops.push(["local_stock/"+k, v]));
    Object.entries(data.movs||{}).forEach(([k,v])=>ops.push(["local_movs/"+k, v]));
    for(let i=0;i<ops.length;i+=400){
      const b = S.db.batch();
      ops.slice(i,i+400).forEach(([path,v])=>b.set(S.db.doc(path), v));
      await b.commit();
    }
    toast(`Importado ✅ (${ops.length} registros)`);
  }catch(e){ toast("Error al importar: "+e.message); }
}

// ---------- Vistas ----------
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  const v = $("#view");
  v.innerHTML = ({inicio:vInicio, local:vLocal, taller:vTaller, ventas:vVentas, caja:vCaja, ajustes:vAjustes})[S.tab]();
}

function resumenDia(f){
  const ventas = S.movs.filter(m=>m.tipo==="venta" && m.fecha===f && !m.anulada);
  const tot = ventas.reduce((a,m)=>a+(m.total||0),0);
  const und = ventas.reduce((a,m)=>a+m.items.reduce((x,i)=>x+i.q,0),0);
  const porMet = {}; ventas.forEach(m=>{ if(m.pagos) Object.entries(m.pagos).forEach(([k,v])=>porMet[k]=(porMet[k]||0)+v); else porMet[m.metodo]=(porMet[m.metodo]||0)+m.total; });
  const porCanal = {detal:0,mayor:0}; ventas.forEach(m=>porCanal[m.canal]=(porCanal[m.canal]||0)+m.total);
  const costo = ventas.reduce((a,m)=>a+m.items.reduce((x,i)=>x+i.q*(i.k!=null?i.k:(linea(i.linea).costo||0)),0),0);
  return {ventas,tot,und,porMet,porCanal,costo,util:tot-costo};
}

function vInicio(){
  const r = resumenDia(hoy());
  const totLocal = Object.values(S.stock).filter(s=>s.ubic==="local").reduce((a,s)=>a+Math.max(0,s.qty),0);
  const totTaller = Object.values(S.stock).filter(s=>s.ubic==="taller").reduce((a,s)=>a+Math.max(0,s.qty),0);
  const bajos = Object.values(S.stock).filter(s=>s.ubic==="local" && s.qty>0 && s.qty<=S.cfg.alertaMin);
  const agot = Object.values(S.stock).filter(s=>s.ubic==="local" && s.qty<=0).length;
  return `
  <div class="card">
    <div class="mut">Vendido hoy</div>
    <div class="big">${money(r.tot)}</div>
    <div class="mut">${r.und} camisas · ${r.ventas.length} ventas · <b style="color:var(--green)">Utilidad ${money(r.util)}</b></div>
    <div class="pills">${Object.entries(r.porMet).map(([k,v])=>`<span class="pill">${esc(k)}: ${money(v)}</span>`).join("") || '<span class="pill">Aún sin ventas hoy</span>'}</div>
  </div>
  <div class="grid3">
    <button class="act a-sell" onclick="openVenta()"><span class="ic">🛍️</span>Vender</button>
    <button class="act a-stamp" onclick="openEstampar()"><span class="ic">🎨</span>Estampar</button>
    <button class="act a-in" onclick="openEntrada()"><span class="ic">📦</span>Entrada lisas</button>
  </div>
  <div class="grid3" style="grid-template-columns:1fr 1fr;margin-top:12px">
    <div class="card" style="margin:0"><div class="mut">En el local</div><div class="big" style="font-size:24px">${totLocal}</div><div class="mut">estampadas</div></div>
    <div class="card" style="margin:0"><div class="mut">En el taller</div><div class="big" style="font-size:24px">${totTaller}</div><div class="mut">lisas</div></div>
  </div>
  ${bajos.length?`<h2>⚠️ Quedan pocas</h2><div class="card"><div class="pills" style="margin:0">${bajos.slice(0,30).map(s=>`<span class="pill">${esc(nom(s))} · T${esc(s.t)}: <b style="color:var(--red)">${s.qty}</b></span>`).join("")}</div></div>`:""}
  <h2>Últimos movimientos</h2>
  <div class="card">${S.movs.slice(0,8).map(movHTML).join("") || '<div class="empty">Todavía no hay movimientos.<br>Empieza cargando tu conteo en las pestañas Local y Taller.</div>'}</div>`;
}

function movHTML(m){
  if(m.tipo==="caja") return `<div class="mov"><div><span class="tag" style="background:${m.anulada?"#bbb":"var(--yellow)"}">${m.anulada?"Anulado":{gasto:"Gasto",ingreso:"Ingreso",traslado:"Traslado"}[m.sub]}</span><span class="mut">${horaDe(m.ts)}</span><div style="font-size:14px;margin-top:4px">${esc(m.cuenta)}${m.destino?" → "+esc(m.destino):""}${m.nota?" · "+esc(m.nota):""}</div></div><div><b>${money(m.monto)}</b></div></div>`;
  const t = m.anulada ? "anulada" : m.tipo;
  const label = {venta:"Venta",estampado:"Estampado",entrada:"Entrada",ajuste:"Ajuste",anulada:"Anulada"}[t];
  const desc = (m.items||[]).map(i=>`${i.q}× ${nom(i)} T${i.t}`).join(", ");
  const right = m.tipo==="venta" ? `<b>${money(m.total)}</b><div class="mut">${m.pagos?Object.entries(m.pagos).map(([k,v])=>esc(k)+" "+money(v)).join(" + "):esc(m.metodo||"")}</div>` : `<div class="mut">${horaDe(m.ts)}</div>`;
  return `<div class="mov"><div><span class="tag t-${t}">${label}</span><span class="mut">${m.tipo==="venta"?horaDe(m.ts):m.fecha}</span><div style="font-size:14px;margin-top:4px">${esc(desc)}${m.nota?` <span class="mut">· ${esc(m.nota)}</span>`:""}</div></div><div style="text-align:right">${right}</div></div>`;
}

function tablaStock(ubic, lid, vars){
  const tallas = S.cfg.tallas, l = lid==="lisa"?null:linea(lid), pd = !!(l&&l.porDiseno);
  let filas;
  if(pd){
    const m={};
    Object.values(S.stock).filter(s=>s.ubic===ubic&&s.linea===lid).forEach(s=>{ m[s.v+"|"+(s.c||"")]={v:s.v,c:s.c||""}; });
    filas = Object.values(m).sort((a,b)=>a.v.localeCompare(b.v)||a.c.localeCompare(b.c));
    if(!filas.length) return `<div class="empty">Aún no hay camisas de ${esc(l.nombre)} aquí.<br><button class="btn sm" style="margin-top:10px" onclick="openNuevo('${ubic}','${lid}')">+ Agregar</button></div>`;
  } else {
    if(!vars.length) return `<div class="empty">Agrega colores en ⚙️ Ajustes.</div>`;
    filas = vars.map(v=>({v,c:""}));
  }
  window._F = filas;
  let totCol = tallas.map(()=>0), gran=0, prev=null;
  const rows = filas.map((f,i)=>{
    let tr=0;
    const tds = tallas.map((t,j)=>{ const q=qtyOf(ubic,lid,f.v,t,f.c); tr+=q; totCol[j]+=q; const cls=q<=0?"z":(ubic==="local"&&q<=S.cfg.alertaMin?"low":""); return `<td class="q ${cls}" onclick="openAjusteIdx('${ubic}','${lid}',${i},${j})">${q}</td>`; }).join("");
    gran+=tr;
    const head = pd && f.v!==prev ? `<tr class="grp"><td colspan="${tallas.length+2}">${esc(f.v)}</td></tr>` : "";
    const lbl = pd ? `<span class="col">${esc(f.c)}</span>` : esc(f.v);
    prev=f.v;
    return `${head}<tr><td>${lbl}</td>${tds}<td class="tot">${tr}</td></tr>`;
  }).join("");

function addItem(){

  if(ex) ex.q+=q; else { const it={linea:V.linea, v:V.v, t:V.t, q, p:precio(V.linea), k:linea(V.linea).costo||0}; if(c) it.c=c; V.items.push(it); }

async function guardarVenta(){
  if(!S.db) return toast("Sin conexión");

  if(V.metodo==="Mixto"){ pagos={}; document.querySelectorAll(".vpago").forEach(i=>{ const n=+i.value||0; if(n) pagos[i.dataset.mt]=n; });

  const items = V.items.map(i=>({...i}));
  closeSheet();

  const mv={tipo:"venta", canal:V.canal, metodo:V.metodo, total, items, nota}; if(pagos) mv.pagos=pagos;
  await addMov(mv);

// ---- CAJA (dinero) ----
function cuentas(){ const c=[...S.cfg.metodos]; Object.keys((S.caja||{}).base||{}).forEach(k=>{ if(!c.includes(k)) c.push(k); }); return c; }
function saldos(){
  const base=(S.caja||{}).base||{}, ts0=(S.caja||{}).ts||0, s={};
  cuentas().forEach(k=>s[k]=base[k]||0);
  S.movs.filter(m=>m.ts>=ts0).forEach(m=>{
    if(m.tipo==="venta" && !m.anulada){ if(m.pagos) Object.entries(m.pagos).forEach(([k,v])=>s[k]=(s[k]||0)+v); else s[m.metodo]=(s[m.metodo]||0)+m.total; }
    if(m.tipo==="caja" && !m.anulada){
      if(m.sub==="ingreso") s[m.cuenta]=(s[m.cuenta]||0)+m.monto;
      if(m.sub==="gasto") s[m.cuenta]=(s[m.cuenta]||0)-m.monto;
      if(m.sub==="traslado"){ s[m.cuenta]=(s[m.cuenta]||0)-m.monto; s[m.destino]=(s[m.destino]||0)+m.monto; }
    }
  });
  return s;
}

  const cm=S.movs.filter(m=>m.tipo==="caja").slice(0,30);

  return `<h2>💵 Caja</h2>
  <div class="card"><div class="mut">Total en todas las cuentas</div><div class="big">${money(tot)}</div>
    ${S.caja?"":'<div class="warn">Aún no hay saldos iniciales.</div>'}
    <div class="mut">Gastos de hoy: ${money(gastosHoy)}</div></div>
  <div class="card">${Object.entries(s).map(([k,v])=>`<div class="mov"><div>${esc(k)}</div><div><b>${money(v)}</b></div></div>`).join("")}</div>
  <div class="grid3">
    <button class="act" style="background:var(--red)" onclick="openCaja('gasto')"><span class="ic">💸</span>Gasto</button>
    <button class="act" style="background:var(--green)" onclick="openCaja('ingreso')"><span class="ic">➕</span>Ingreso</button>
    <button class="act" style="background:var(--blue)" onclick="openCaja('traslado')"><span class="ic">🔁</span>Traslado</button>
  </div>
  <div class="hint">Las ventas suman solas a su cuenta según el medio de pago.</div>
  <h2>Movimientos de caja</h2>
  <div class="card">${cm.map(m=>`<div class="mov"><div><span class="tag" style="background:${m.anulada?"#bbb":{gasto:"var(--red)",ingreso:"var(--green)",traslado:"var(--blue)"}[m.sub]}">${m.anulada?"Anulado":{gasto:"Gasto",ingreso:"Ingreso",traslado:"Traslado"}[m.sub]}</span><span class="mut">${m.fecha} ${horaDe(m.ts)}</span><div style="font-size:14px;margin-top:4px">${esc(m.cuenta)}${m.sub==="traslado"?" → "+esc(m.destino):""}${m.nota?` · <span class="mut">${esc(m.nota)}</span>`:""}</div></div><div style="text-align:right"><b>${money(m.monto)}</b>${m.anulada?"":`<div><button class="x" style="font-size:12px" onclick="anularCaja('${m.id}')">anular</button></div>`}</div></div>`).join("")||'<div class="empty">Sin movimientos de caja</div>'}</div>`;
}
let C;
function openCaja(sub){ C={sub,cuenta:S.cfg.metodos[0],destino:null}; drawCaja(); }
function drawCaja(){
  const t={gasto:"💸 Gasto",ingreso:"➕ Ingreso",traslado:"🔁 Traslado"}[C.sub];
  openSheet(`<div class="row" style="justify-content:space-between"><h3>${t}</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <label>${C.sub==="traslado"?"Sale de":"Cuenta"}</label>${chips("cc", cuentas(), C.cuenta)}
    ${C.sub==="traslado"?`<label>Entra a</label>${chips("cd", cuentas().filter(k=>k!==C.cuenta), C.destino)}`:""}
    <label>Monto</label><input type="number" id="cmonto" inputmode="numeric" value="${C.monto||""}">
    <label>Concepto</label><input type="text" id="cnota" value="${esc(C.nota||"")}" placeholder="${C.sub==="gasto"?"Ej: bolsas, almuerzo, envío":"Ej: abono cliente"}">
    <div style="height:14px"></div><button class="btn" onclick="guardarCaja()">Guardar</button>`);
  const keep=()=>{ C.monto=$("#cmonto").value; C.nota=$("#cnota").value; };
  $("#sheet").querySelectorAll("[data-cc]").forEach(b=>b.onclick=()=>{keep();C.cuenta=b.dataset.cc;if(C.destino===C.cuenta)C.destino=null;drawCaja();});
  $("#sheet").querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{keep();C.destino=b.dataset.cd;drawCaja();});
}
async function guardarCaja(){
  if(!S.db) return toast("Sin conexión");
  const monto=+$("#cmonto").value||0, nota=$("#cnota").value.trim();
  if(monto<=0) return toast("Pon el monto");
  if(C.sub==="traslado" && !C.destino) return toast("Escoge a qué cuenta entra");
  const m={tipo:"caja", sub:C.sub, cuenta:C.cuenta, monto, nota, items:[]}; if(C.sub==="traslado") m.destino=C.destino;
  closeSheet(); await addMov(m); toast("Guardado ✅");
}
async function anularCaja(id){ if(!S.db) return; await S.db.collection("local_movs").doc(id).update({anulada:true}); toast("Anulado"); }

// ---- AJUSTE / CONTEO ----
function openAjuste(ubic,lid,v,t,c){
  c = c||null;
  const cur = qtyOf(ubic,lid,v,t,c);
  const nombre = nom({linea:lid,v,c});
  openSheet(`
    <div class="row" style="justify-content:space-between"><h3>✏️ Corregir cantidad</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="mut">${esc(nombre)} · Talla ${esc(t)} · ${ubic==="local"?"Local":"Taller"}</div>
    <label>Cantidad real contada</label>
    <div class="step"><button type="button" onclick="bumpA(-1)">−</button><input type="number" id="aq" value="${cur}" inputmode="numeric"><button type="button" onclick="bumpA(1)">+</button></div>
    <div class="mut" style="margin-top:6px">Ahora dice: ${cur}</div>
    <div style="height:14px"></div>
    <button class="btn" onclick='guardarAjuste(${JSON.stringify([ubic,lid,v,t,c]).replace(/'/g,"&#39;")})'>Guardar</button>
  `);
  setTimeout(()=>{ const i=$("#aq"); i.focus(); i.select(); },50);
}
function bumpA(d){ const i=$("#aq"); i.value=Math.max(0,(+i.value||0)+d); }
async function guardarAjuste([ubic,lid,v,t,c]){
  if(!S.db) return toast("Sin conexión");
  const cur = qtyOf(ubic,lid,v,t,c), n = Math.max(0,+$("#aq").value||0);
  closeSheet(); if(n===cur) return;
  await writeStock([{ubic,linea:lid,v,c,t,set:n}]);
  const it={linea:lid,v,t,q:n-cur}; if(c) it.c=c;
  await addMov({tipo:"ajuste", items:[it], nota:`${ubic==="local"?"Local":"Taller"}: ${cur} → ${n}`});
  toast("Cantidad actualizada ✅");
}

// ---- AGREGAR diseño/color nuevo al conteo ----
let A;
function openNuevo(ubic,lid){ A={ubic,lid,v:null,c:null,t:null}; drawNuevo(); }
function drawNuevo(){
  const l=linea(A.lid), ok=A.v&&A.c&&A.t;
  const cur = ok ? qtyOf(A.ubic,A.lid,A.v,A.t,A.c) : null;
  openSheet(`
    <div class="row" style="justify-content:space-between"><h3>➕ Agregar al conteo</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="mut">${esc(l.nombre)} · ${A.ubic==="local"?"Local":"Taller"}</div>
    <label>Diseño</label>${(l.disenos||[]).length?chips("ad", l.disenos, A.v):'<div class="mut">Agrega los diseños en ⚙️ Ajustes</div>'}
    <label>Color</label>${chips("ac", S.cfg.colores, A.c)}
    <label>Talla</label>${chips("at", S.cfg.tallas, A.t)}
    <label>Cantidad ${cur!=null?`<span style="float:right">Ya hay: <b>${cur}</b></span>`:""}</label>${stepper("aqn",1)}
    <div style="height:14px"></div>
    <div class="row"><button class="btn sec" ${ok?"":"disabled"} onclick="guardarNuevo(true)">Guardar y otro</button><button class="btn" ${ok?"":"disabled"} onclick="guardarNuevo(false)">Guardar</button></div>`);
  $("#sheet").querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{A.v=b.dataset.ad;drawNuevo();});
  $("#sheet").querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{A.c=b.dataset.ac;drawNuevo();});
  $("#sheet").querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{A.t=b.dataset.at;drawNuevo();});
}
async function guardarNuevo(otro){
  if(!S.db) return toast("Sin conexión");
  const q=Math.max(1,+$("#aqn").value||1);
  await writeStock([{ubic:A.ubic,linea:A.lid,v:A.v,c:A.c,t:A.t,delta:q}]);
  await addMov({tipo:"ajuste", items:[{linea:A.lid,v:A.v,c:A.c,t:A.t,q}], nota:"Conteo"});
  toast(`+${q} ${nom({linea:A.lid,v:A.v,c:A.c})} T${A.t} ✅`);
  if(otro){ A.t=null; drawNuevo(); } else closeSheet();
}

// ---------- Navegación ----------
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
init();
</script>
</body>
