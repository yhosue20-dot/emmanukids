<!doctype html>

<head>

<title>EMMANUKIDS · Administración</title>
<style>
:root{
  --bg:#f4f4f5; --card:#fff; --linea:#e4e4e7; --texto:#18181b; --suave:#71717a;
  --tinta:#d6206b; --tinta-bg:#fdf2f7; --ok:#047857; --ok-bg:#ecfdf5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--texto);font-size:15px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
input,select,textarea,button{font:inherit;font-size:16px}
.cifra{font-variant-numeric:tabular-nums}
header{background:#18181b;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header b{letter-spacing:-.02em}
header small{color:#a1a1aa;display:block;font-size:11px}
main{padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linea);
  display:flex;overflow-x:auto;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;min-width:72px;border:0;background:none;padding:9px 4px;color:var(--suave);
  font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{font-size:17px;line-height:1}
nav button.on{color:var(--tinta)}
.card{background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--suave)}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);
  font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;min-height:46px;border:1px solid #d4d4d8;
  border-radius:12px;background:#fff;color:var(--texto)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tinta);box-shadow:0 0 0 3px var(--tinta-bg)}
button.b{border:0;border-radius:12px;min-height:48px;padding:0 16px;font-weight:700;width:100%;

button.b:active{transform:scale(.985)}
button.b:disabled{opacity:.4}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.kpi{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:12px}

.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}

.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f4f4f5}
.item:last-child{border:0}

.aviso{padding:10px 12px;border-radius:12px;font-size:13.5px;margin-bottom:12px}
.aviso.err{background:var(--tinta-bg);color:#8a0f44}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.vacio{text-align:center;color:var(--suave);font-size:13.5px;padding:22px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--suave);letter-spacing:.05em;
  padding:6px 4px;border-bottom:1px solid var(--linea)}
td{padding:7px 4px;border-bottom:1px solid #f4f4f5}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.prod{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:11px;text-align:left;
  width:100%;min-height:auto}
.prod.off{opacity:.4}
.punto{width:11px;height:11px;border-radius:99px;border:1px solid #d4d4d8;display:inline-block;vertical-align:-1px}
.barra{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));background:#fff;
  border-top:1px solid var(--linea);padding:12px 14px;z-index:19;max-height:66vh;overflow-y:auto;
  box-shadow:0 -8px 24px rgba(0,0,0,.07)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.modal>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px;
  max-height:88vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#recibo{display:none}
@media print{
  body>*{display:none!important}
  #recibo{display:block!important;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:0}
  #recibo hr{border:0;border-top:1px dashed #000}
}

<body>

<div id="login" style="display:none;position:fixed;inset:0;background:#18181b;
  align-items:center;justify-content:center;padding:24px;z-index:50"></div>

<div id="app" style="display:none">
  <header>
    <div><b>EMMANUKIDS</b><small id="hsub">Administración</small></div>
    <button class="b g chico" onclick="A.salir()">Salir · <span id="quien"></span></button>
  </header>
  <main id="vista"></main>
  <nav id="nav"></nav>
</div>

<div id="recibo"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   EMMANUKIDS · Sistema de administración · versión en la nube
   Los datos viven en Firebase. Varias personas a la vez.
   ═══════════════════════════════════════════════════════════ */

import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,collection,onSnapshot,query,orderBy,limit,
  runTransaction,setDoc,getDoc,enableIndexedDbPersistence}
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ╔═══════════════════════════════════════════════════════╗
   ║  PEGA AQUÍ LOS DATOS DE TU PROYECTO FIREBASE          ║
   ║  Consola → ⚙ Configuración → Tus apps → Web           ║
   ╚═══════════════════════════════════════════════════════╝ */
const FIREBASE = {
  apiKey:            "AIzaSyAQB7LmzskNcajuX_EzkD_DzF35_CrhcCE",
  authDomain:        "emmakids-2bc21.firebaseapp.com",
  projectId:         "emmakids-2bc21",
  storageBucket:     "emmakids-2bc21.firebasestorage.app",
  messagingSenderId: "407227021780",
  appId:             "1:407227021780:web:45e620e0d1c1d8e1d7be41"
};

const app=initializeApp(FIREBASE);
const auth=getAuth(app);
const db=getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});

const rInv=doc(db,'estado','inventario');
const rCue=doc(db,'estado','cuentas');
const rCfg=doc(db,'config','general');

let S=null, tab='inicio', msg=null, tmp={}, yo=null, listos=0, PEND=null;
const admin=()=>yo?.rol==='ADMIN';

/* ── Utilidades ─────────────────────────────────────────── */
const $=id=>document.getElementById(id);
const cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(+n||0));
const num=n=>new Intl.NumberFormat('es-CO').format(Math.round(+n||0));
const hoy=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
const fecha=f=>{const d=new Date(f+'T12:00:00');return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'2-digit'})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const val=x=>{const e=$(x);return e?e.value:''};
const nval=x=>+String(val(x)).replace(/[^\d.-]/g,'')||0;

function decir(texto,tipo){msg={texto,tipo:tipo||'ok'};pintar();
  setTimeout(()=>{if(msg&&msg.texto===texto){msg=null;pintar()}},4500)}

/* ── Datos iniciales ────────────────────────────────────── */
function nuevo(){
  return {
    empresa:{nombre:'EMMANUKIDS',tel:'',nit:''},
    colores:[{id:'c1',n:'Negro',hex:'#111'},{id:'c2',n:'Blanco',hex:'#fff'},
             {id:'c3',n:'Gris jaspe',hex:'#9aa0a6'},{id:'c4',n:'Azul rey',hex:'#1f4ea1'},
             {id:'c5',n:'Rojo',hex:'#c62828'}],
    tallas:[{id:'t1',n:'2'},{id:'t2',n:'4'},{id:'t3',n:'6'},{id:'t4',n:'8'},
            {id:'t5',n:'10'},{id:'t6',n:'12'},{id:'t7',n:'14'},{id:'t8',n:'16'}],
    disenos:[],
    lineas:[
      {id:'L1',n:'Económica',precio:37000,estampado:3500,margenMin:15,
       pack:{und:3,precio:97000},
       rangos:[{min:1,max:5,p:37000},{min:6,max:20,p:32000},{min:21,max:null,p:28000}]},
      {id:'L2',n:'Premium',precio:47000,estampado:6800,margenMin:15,
       pack:{und:3,precio:125000},
       rangos:[{min:1,max:5,p:47000},{min:6,max:20,p:41000},{min:21,max:null,p:36000}]}
    ],
    clientes:[{id:'cl0',n:'Consumidor final',tel:'',cupo:0}],
    proveedores:[],
    cuentas:[{id:'q1',n:'Efectivo',saldo:0},{id:'q2',n:'Nequi',saldo:0},
             {id:'q3',n:'Daviplata',saldo:0},{id:'q4',n:'Bancolombia',saldo:0}],
    catGastos:['Arriendo','Servicios','Transporte','Publicidad','Insumos taller','Otros'],
    lisas:{}, terminados:{},
    compras:[], ordenes:[], facturas:[], pagos:[], gastos:[],
    kardex:[], caja:[], asientos:[],
    consecutivo:0, stockMin:5, usaDisenos:false
  };
}
const usaDis=()=>!!S.usaDisenos;
const DGEN='gen';

/* ── Conexión con Firestore ─────────────────────────────── */
/* Los datos se reparten así:
   config/general      → catálogos, precios, clientes (lo que casi no cambia)
   estado/inventario   → existencias y costos  ← el que se pelean los usuarios
   estado/cuentas      → saldos de caja y bancos
   facturas, compras, ordenes, gastos, pagos, kardex, caja, asientos → historial
   Toda operación que toque inventario o plata corre dentro de una transacción,
   así dos personas vendiendo al tiempo nunca dejan el stock en negativo.       */

const CONFIG=['empresa','colores','tallas','disenos','lineas','clientes','proveedores',
  'catGastos','stockMin','usaDisenos','consecutivo'];

async function sembrar(){
  const base=nuevo();
  const c=await getDoc(rCfg);
  if(!c.exists()){
    const o={}; CONFIG.forEach(k=>o[k]=base[k]);
    await setDoc(rCfg,o);
    await setDoc(rInv,{lisas:{},terminados:{}});
    await setDoc(rCue,{lista:base.cuentas});
  }
}

function escuchar(){
  S=nuevo();
  const listas=[['facturas',400],['compras',150],['ordenes',150],['gastos',300],
                ['pagos',400],['kardex',400],['caja',400],['asientos',400]];

  onSnapshot(rCfg,d=>{ if(d.exists()) Object.assign(S,d.data());
    S.lineas.forEach(L=>{ if(!L.pack) L.pack={und:3,precio:Math.round(L.precio*3*0.87)} });
    refrescar() });
  onSnapshot(rInv,d=>{ const v=d.data()||{}; S.lisas=v.lisas||{}; S.terminados=v.terminados||{}; refrescar() });
  onSnapshot(rCue,d=>{ S.cuentas=(d.data()||{}).lista||S.cuentas; refrescar() });

  listas.forEach(([col,n])=>{
    onSnapshot(query(collection(db,col),orderBy('creado','desc'),limit(n)),
      s=>{ S[col]=s.docs.map(x=>({...x.data(),_id:x.id})); refrescar() },
      ()=>{});
  });
}

/* No repintar mientras alguien está escribiendo en un campo */
let pend=null;
function refrescar(){
  clearTimeout(pend);
  pend=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)) return refrescar();
    if(S) pintar();
  },250);
}

/* Transacción: lee el estado real del servidor, aplica los cambios y los guarda
   todos juntos. Si algo falla a mitad, no queda nada a medias.                */
async function tx(fn,extras=[]){
  return runTransaction(db,async t=>{
    const iS=await t.get(rInv), cS=await t.get(rCue), gS=await t.get(rCfg);
    const ex=[]; for(const r of extras) ex.push(await t.get(r));

    const iv=iS.data()||{}; S.lisas=iv.lisas||{}; S.terminados=iv.terminados||{};
    S.cuentas=(cS.data()||{}).lista||S.cuentas;
    const g=gS.data()||{};
    S.consecutivo=g.consecutivo||0; S.consCompra=g.consCompra||0; S.consOrden=g.consOrden||0;

    PEND={docs:[],updates:[],cfg:null};
    const r=fn(ex);

    t.set(rInv,{lisas:S.lisas,terminados:S.terminados});
    t.set(rCue,{lista:S.cuentas});
    if(PEND.cfg) t.set(rCfg,PEND.cfg,{merge:true});
    PEND.docs.forEach(d=>t.set(doc(collection(db,d.col)),
      {...d.data,creado:Date.now(),por:yo.nombre,uid:yo.uid}));
    PEND.updates.forEach(u=>t.update(u.ref,u.data));
    return r;
  });
}
function nuevoDoc(col,data){PEND.docs.push({col,data})}

async function correr(fn,extras,ok){
  try{ const r=await tx(fn,extras||[]); decir(typeof ok==='function'?ok(r):ok) }
  catch(e){ decir(e.message||'No se pudo guardar. Revisa la conexión.','err') }
}

/* ── Búsquedas ──────────────────────────────────────────── */
const color=i=>S.colores.find(x=>x.id===i)||{n:'?',hex:'#ccc'};
const talla=i=>S.tallas.find(x=>x.id===i)||{n:'?'};
const diseno=i=>S.disenos.find(x=>x.id===i)||{n:'General'};
const linea=i=>S.lineas.find(x=>x.id===i)||S.lineas[0];
const cliente=i=>S.clientes.find(x=>x.id===i)||{n:'Consumidor final'};
const cuenta=i=>S.cuentas.find(x=>x.id===i)||S.cuentas[0];

const kL=(c,t)=>c+'|'+t;
const kT=(d,l,c,t)=>[d,l,c,t].join('|');
const nomL=k=>{const[c,t]=k.split('|');return color(c).n+' · T'+talla(t).n};
const nomT=k=>{const[d,l,c,t]=k.split('|');
  return (usaDis()?diseno(d).n+' · ':'')+linea(l).n+' · '+color(c).n+' · T'+talla(t).n};

const invL=k=>S.lisas[k]||{cant:0,valor:0};
const invT=k=>S.terminados[k]||{cant:0,valor:0};
const costoL=k=>{const i=invL(k);return i.cant>0?i.valor/i.cant:0};
const costoT=k=>{const i=invT(k);return i.cant>0?i.valor/i.cant:0};

/* ── Motor de inventario (promedio ponderado móvil) ─────── */
function entrada(tipo,k,cant,costoUnit,dc){
  const inv=tipo==='L'?S.lisas:S.terminados;
  const a=inv[k]||{cant:0,valor:0};
  a.cant+=cant; a.valor+=cant*costoUnit; inv[k]=a;
  nuevoDoc('kardex',{f:dc.f,tipo,k,mov:'ENTRADA',cant,cu:costoUnit,
    saldo:a.cant,doc:dc.t,ref:dc.ref});
}
function salida(tipo,k,cant,dc){
  const inv=tipo==='L'?S.lisas:S.terminados;
  const a=inv[k]||{cant:0,valor:0};
  if(a.cant<cant) throw new Error('No hay suficiente '+(tipo==='L'?nomL(k):nomT(k))+
    '. Disponible: '+a.cant+', necesitas: '+cant);
  const cu=a.cant>0?a.valor/a.cant:0;
  a.cant-=cant; a.valor=Math.max(a.valor-cant*cu,0); inv[k]=a;
  nuevoDoc('kardex',{f:dc.f,tipo,k,mov:'SALIDA',cant,cu,saldo:a.cant,doc:dc.t,ref:dc.ref});
  return cu;
}
function mover(cuentaId,tipo,monto,concepto,f){
  const q=cuenta(cuentaId);
  q.saldo+=tipo==='INGRESO'?monto:-monto;
  nuevoDoc('caja',{f,cuenta:q.id,tipo,monto,saldo:q.saldo,concepto});
}
function asiento(f,concepto,lineas){
  const ls=lineas.filter(l=>(l.d||0)>0||(l.c||0)>0);
  nuevoDoc('asientos',{f,concepto,lineas:ls});
}

/* ── Precio por cantidad ────────────────────────────────── */
function precioPor(lineaId,cant,tipoVenta){
  const L=linea(lineaId);
  if(tipoVenta!=='MAYOR') return L.precio;
  const r=(L.rangos||[]).filter(r=>cant>=r.min&&(r.max==null||cant<=r.max))
    .sort((a,b)=>b.min-a.min)[0];
  return r?r.p:L.precio;
}

/* ═══════════ ACCIONES ═══════════════════════════════════ */
const A={};

/* --- Compras --- */
A.addCompraFila=()=>{
  const c=val('cCol'), t=val('cTal'), q=nval('cCant'), cu=nval('cCosto');
  if(!c||!t||q<=0||cu<=0) return decir('Completa color, talla, cantidad y costo','err');
  tmp.compra=tmp.compra||[];
  const k=kL(c,t), ex=tmp.compra.find(x=>x.k===k&&x.cu===cu);
  if(ex) ex.cant+=q; else tmp.compra.push({k,cant:q,cu});
  $('cCant').value=''; pintar();
};
A.delCompraFila=i=>{tmp.compra.splice(i,1);pintar()};
A.guardarCompra=()=>{
  const items=tmp.compra||[];
  if(!items.length) return decir('Agrega al menos una fila','err');
  const f=val('cFecha')||hoy(), flete=nval('cFlete'), qId=val('cCuenta');
  const credito=$('cCredito').checked;
  const unidades=items.reduce((s,i)=>s+i.cant,0);
  const sub=items.reduce((s,i)=>s+i.cant*i.cu,0);
  const total=sub+flete, fleteU=unidades?flete/unidades:0;
  const prov=val('cProv'), nro=val('cNro');
  correr(()=>{
    const ref='C'+(S.consCompra+1);
    PEND.cfg={consCompra:S.consCompra+1};
    items.forEach(i=>entrada('L',i.k,i.cant,i.cu+fleteU,{f,t:'COMPRA',ref}));
    nuevoDoc('compras',{ref,f,prov,nro,items,flete,total,credito,cuenta:qId});
    if(!credito&&qId) mover(qId,'EGRESO',total,'Compra '+(nro||ref),f);
    asiento(f,'Compra de lisas '+ref,[
      {cuenta:'1435 Inventario lisas',d:total},
      {cuenta:credito?'2205 Proveedores':'1105 Caja y bancos',c:total}]);
  },[],()=>{tmp.compra=[];return num(unidades)+' camisetas lisas ingresaron por '+cop(total)});
};

/* --- Producción --- */
A.addProdFila=()=>{
  const c=val('pCol'), t=val('pTal'), q=nval('pCant'), m=nval('pMerma');
  if(!c||!t||q<=0) return decir('Indica color, talla y cantidad','err');
  if(m>q) return decir('La merma no puede ser mayor que la cantidad','err');
  const k=kL(c,t);
  if(invL(k).cant<q) return decir('Solo hay '+invL(k).cant+' lisas de '+nomL(k),'err');
  tmp.prod=tmp.prod||[];
  tmp.prod.push({k,cant:q,merma:m});
  $('pCant').value=''; $('pMerma').value='0'; pintar();
};
A.delProdFila=i=>{tmp.prod.splice(i,1);pintar()};
A.guardarProd=()=>{
  const filas=tmp.prod||[];
  if(!filas.length) return decir('Agrega qué camisetas vas a estampar','err');
  const dId=usaDis()?val('pDis'):DGEN, lId=val('pLin');
  if(usaDis()&&!dId) return decir('Elige el diseño. Créalo en Ajustes si no está','err');
  const f=val('pFecha')||hoy(), est=nval('pEst'), mo=nval('pMO'), qId=val('pCuenta');
  const procesadas=filas.reduce((s,r)=>s+r.cant,0);
  const buenas=filas.reduce((s,r)=>s+(r.cant-r.merma),0);
  if(buenas<=0) return decir('La orden no deja unidades buenas','err');
  correr(()=>{
    const ref='OP'+(S.consOrden+1);
    PEND.cfg={consOrden:S.consOrden+1};
    let costoLisas=0;
    filas.forEach(r=>{costoLisas+=salida('L',r.k,r.cant,{f,t:'PRODUCCION',ref})*r.cant});
    const costoEst=est*procesadas;
    const totalCosto=costoLisas+costoEst+mo;
    const cu=totalCosto/buenas;              // la merma la absorben las buenas
    filas.forEach(r=>{
      const b=r.cant-r.merma; if(b<=0) return;
      const [c,t]=r.k.split('|');
      entrada('T',kT(dId,lId,c,t),b,cu,{f,t:'PRODUCCION',ref});
    });
    const desembolso=costoEst+mo;
    if(desembolso>0&&qId) mover(qId,'EGRESO',desembolso,'Producción '+ref,f);
    asiento(f,'Producción '+ref,[
      {cuenta:'1430 Inventario estampadas',d:totalCosto},
      {cuenta:'1435 Inventario lisas',c:costoLisas},
      {cuenta:'1105 Caja y bancos',c:desembolso}]);
    nuevoDoc('ordenes',{ref,f,diseno:dId,linea:lId,filas,est,mo,
      procesadas,buenas,merma:procesadas-buenas,costoLisas,costoTotal:totalCosto,cu});
    return cu;
  },[],cu=>{tmp.prod=[];return num(buenas)+' camisetas listas · costo real '+cop(cu)+' c/u'});
};

A.agregar=k=>{

A.cant=(k,d)=>{

  c.cant+=d;

function lineasCarrito(){
  const tv=tmp.tipoVenta||'DETAL';
  const carro=tmp.carrito||[];
  const man=tmp.precioMan||{};

  // Modo pack: se cuentan TODAS las unidades de cada línea, aunque sean diseños
  // o tallas distintos. Cada 3 forman un pack; lo que sobra va a precio normal.
  const pack={};
  if(tv==='PACK'){
    const grupos={};
    carro.forEach(c=>{ if(man[c.k]!=null) return;
      const l=c.k.split('|')[1]; grupos[l]=(grupos[l]||0)+c.cant });
    Object.entries(grupos).forEach(([l,n])=>{
      const L=linea(l), P=L.pack||{und:3,precio:L.precio*3};
      const packs=Math.floor(n/P.und), resto=n%P.und;
      const total=packs*P.precio+resto*L.precio;
      pack[l]={unit:n>0?total/n:L.precio,packs,resto,und:P.und,precioPack:P.precio,linea:L.n};
    });
  }
  tmp._pack=pack;

  return carro.map(c=>{
    const l=c.k.split('|')[1];
    let p, origen;
    if(man[c.k]!=null){ p=man[c.k]; origen='manual' }
    else if(tv==='PACK'&&pack[l]){ p=pack[l].unit; origen='pack' }
    else { p=precioPor(l,c.cant,tv); origen=tv.toLowerCase() }
    const neto=p*c.cant, cu=costoT(c.k);
    return {...c,precio:p,origen,neto,cu,costo:cu*c.cant,util:neto-cu*c.cant};
  });
}
A.tipoVenta=t=>{tmp.tipoVenta=t;pintar()};
A.precio=k=>{
  const actual=lineasCarrito().find(l=>l.k===k);
  const v=prompt('Precio por unidad\n'+nomT(k)+'\n\nDeja vacío para volver al precio de la lista:',
    Math.round(actual?actual.precio:0));
  if(v===null) return;
  tmp.precioMan=tmp.precioMan||{};
  const n=+String(v).replace(/[^\d]/g,'');
  if(!n) delete tmp.precioMan[k]; else tmp.precioMan[k]=n;
  pintar();
};
A.cobrar=fiado=>{
  const ls=lineasCarrito();
  if(!ls.length) return decir('El carrito está vacío','err');
  const f=hoy(), clId=val('vCliente')||'cl0', qId=val('vCuenta');
  const total=ls.reduce((s,l)=>s+l.neto,0);
  const costo=ls.reduce((s,l)=>s+l.costo,0);
  for(const l of ls){
    if(l.neto<l.costo) return decir(nomT(l.k)+' quedaría por debajo del costo ('+cop(l.cu)+' c/u)','err');
    const m=l.neto>0?(l.util/l.neto)*100:0;
    const min=linea(l.k.split('|')[1]).margenMin||0;
    if(m<min&&!confirm(nomT(l.k)+' deja solo '+m.toFixed(1)+'% de margen (mínimo '+min+'%).\n¿Vender de todos modos?')) return;
  }
  let recibido=fiado?nval('vAbono'):total;
  if(recibido>total) recibido=total;
  const saldo=total-recibido;
  if(saldo>0&&clId==='cl0') return decir('Para fiar necesitas escoger un cliente con nombre','err');
  const limite=saldo>0?(val('vLimite')||''):'';
  const tipoV=tmp.tipoVenta||'DETAL';
  correr(()=>{
    // El consecutivo se toma del servidor dentro de la transacción:
    // aunque dos vendan al mismo segundo, no se repite el número.
    const nro='A-'+String(S.consecutivo+1).padStart(5,'0');
    PEND.cfg={consecutivo:S.consecutivo+1};
    const det=ls.map(l=>{
      const cu=salida('T',l.k,l.cant,{f,t:'VENTA',ref:nro});
      return {k:l.k,cant:l.cant,precio:l.precio,origen:l.origen,neto:l.neto,cu,
              costo:cu*l.cant,util:l.neto-cu*l.cant};
    });
    const costoReal=det.reduce((s,d)=>s+d.costo,0);
    nuevoDoc('facturas',{nro,f,cliente:clId,tipo:tipoV,det,total,
      abonado:recibido,saldo,costo:costoReal,util:total-costoReal,limite,cuentaPago:qId,
      estado:saldo<=0?'PAGADA':(recibido>0?'PARCIAL':'PENDIENTE')});
    if(recibido>0){
      nuevoDoc('pagos',{fac:nro,f,monto:recibido,cuenta:qId,metodo:cuenta(qId).n});
      mover(qId,'INGRESO',recibido,'Venta '+nro,f);
    }
    asiento(f,'Venta '+nro,[
      {cuenta:'1105 Caja y bancos',d:recibido},
      {cuenta:'1305 Clientes',d:saldo},
      {cuenta:'4135 Ventas',c:total},
      {cuenta:'6135 Costo de ventas',d:costoReal},
      {cuenta:'1430 Inventario estampadas',c:costoReal}]);
    return nro;
  },[],nro=>{tmp.carrito=[];tmp.precioMan={};tmp.cobrando=false;
    return 'Factura '+nro+' por '+cop(total)+(saldo>0?' · queda debiendo '+cop(saldo):'')});
};

A.abonar=facId=>{
  const fac=S.facturas.find(x=>x._id===facId); if(!fac)return;
  const m=prompt('Abono para '+fac.nro+'\nSaldo actual: '+cop(fac.saldo)+
    '\n\n¿A qué cuenta entra? '+S.cuentas.map((q,i)=>(i+1)+'='+q.n).join('  '),'');

  const monto=+String(m).replace(/[^\d]/g,'');
  if(!monto) return;
  const c=prompt('Número de la cuenta donde entró el dinero:\n'+
    S.cuentas.map((q,i)=>(i+1)+'. '+q.n).join('\n'),'1');

};

A.anular=facId=>{
  const fac=S.facturas.find(x=>x._id===facId); if(!fac)return;
  if(fac.estado==='ANULADA') return;
  if(!confirm('¿Anular '+fac.nro+'? Las camisetas vuelven al inventario y se devuelve el dinero recibido.')) return;
  const f=hoy(), ref=doc(db,'facturas',facId);
  correr(ex=>{
    const d0=ex[0].data();
    if(d0.estado==='ANULADA') throw new Error('Otra persona ya anuló esta factura');

  const term=Object.values(S.terminados).reduce((s,i)=>s+i.cant,0);

                 Object.values(S.terminados).reduce((s,i)=>s+i.valor,0);

/* ── Taller ─────────────────────────────────────────────── */
function vTaller(){
  const filas=tmp.prod||[];
  const proc=filas.reduce((s,r)=>s+r.cant,0);
  const buenas=filas.reduce((s,r)=>s+(r.cant-r.merma),0);
  const est=nval('pEst'), mo=nval('pMO');
  const costoLisas=filas.reduce((s,r)=>s+costoL(r.k)*r.cant,0);
  const cuEstimado=buenas>0?(costoLisas+est*proc+mo)/buenas:0;

  return `
  <div class="card"><h3>Registrar estampado</h3>
    ${usaDis()&&!S.disenos.length?'<div class="aviso err">Primero crea al menos un diseño en Ajustes.</div>':''}
    <div class="g2">
      <div><label>Fecha</label><input type="date" id="pFecha" value="${hoy()}"></div>
      <div><label>Tipo de estampado</label><select id="pLin" onchange="tmp.lin=this.value;pintar()">
        ${S.lineas.map(l=>`<option value="${l.id}"${tmp.lin===l.id?' selected':''}>${esc(l.n)}</option>`).join('')}</select></div>
    </div>
    ${usaDis()?`<label>Diseño</label>
    <select id="pDis">${S.disenos.map(d=>`<option value="${d.id}">${esc(d.n)}</option>`).join('')}</select>`:''}

    <label>¿Qué camisetas lisas vas a usar?</label>
    <div class="g3">
      <select id="pCol">${optColor()}</select>
      <select id="pTal">${optTalla()}</select>
      <input id="pCant" inputmode="numeric" placeholder="Cant.">
    </div>
    <div class="fila" style="margin-top:8px">
      <input id="pMerma" inputmode="numeric" placeholder="Dañadas" value="0">
      <button class="b n chico" style="flex:0 0 auto" onclick="A.addProdFila()">Agregar</button>
    </div>

    ${filas.length?`<div style="margin-top:14px">
      ${filas.map((r,i)=>`<div class="item">
        <div><div class="t">${esc(nomL(r.k))}</div>
          <div class="s">${r.cant} usadas${r.merma?' · '+r.merma+' dañadas':''} · lisa a ${cop(costoL(r.k))}</div></div>
        <div class="m"><button class="b g chico" style="min-height:30px" onclick="A.delProdFila(${i})">✕</button></div>
      </div>`).join('')}</div>`:'<div class="vacio">Agrega qué lisas entran al estampado.</div>'}

    <div class="g2">
      <div><label>Transfer DTF c/u</label>
        <input id="pEst" inputmode="numeric" value="${tmp.lin?linea(tmp.lin).estampado:S.lineas[0].estampado}" oninput="pintarSoloCosto()"></div>
      <div><label>Mano de obra total</label><input id="pMO" inputmode="numeric" value="0" oninput="pintarSoloCosto()"></div>
    </div>
    <label>Se paga desde</label><select id="pCuenta">${optCuenta()}</select>

    ${filas.length?`<div class="aviso ok" style="margin-top:12px" id="costoPrev">
      ${num(buenas)} buenas de ${num(proc)} · costo real <b>${cop(cuEstimado)}</b> cada una</div>`:''}
    <button class="b" onclick="A.guardarProd()">Registrar producción</button>
  </div>

  <div class="card"><h3>Producciones anteriores</h3>
    ${S.ordenes.slice().reverse().slice(0,15).map(o=>`<div class="item">
      <div><div class="t">${usaDis()?esc(diseno(o.diseno).n)+' · ':''}${esc(linea(o.linea).n)}</div>
        <div class="s">${fecha(o.f)} · ${o.buenas} buenas${o.merma?', '+o.merma+' dañadas':''}</div></div>
      <div class="m cifra">${cop(o.cu)}<div class="s" style="font-weight:400">c/u</div></div></div>`).join('')
      ||'<div class="vacio">Todavía no has registrado estampados.</div>'}
  </div>`;
}
function pintarSoloCosto(){
  const e=$('costoPrev'); if(!e)return;
  const filas=tmp.prod||[];
  const proc=filas.reduce((s,r)=>s+r.cant,0), buenas=filas.reduce((s,r)=>s+(r.cant-r.merma),0);
  const costoLisas=filas.reduce((s,r)=>s+costoL(r.k)*r.cant,0);
  const cu=buenas>0?(costoLisas+nval('pEst')*proc+nval('pMO'))/buenas:0;
  e.innerHTML=num(buenas)+' buenas de '+num(proc)+' · costo real <b>'+cop(cu)+'</b> cada una';
}

          <input id="bCosto" inputmode="numeric" placeholder="Costo real c/u">
          <button class="b g chico" style="flex:0 0 auto" onclick="A.sugerirCosto()">Sugerir</button>
          <button class="b n chico" style="flex:0 0 auto" onclick="A.addApertura('T')">Agregar</button>
        </div>
        <div style="font-size:11.5px;color:var(--suave);margin-top:5px">

        ${ap.T.map((r,i)=>`<div class="item">

      <button class="b" style="margin-top:12px" onclick="A.guardarApertura()">Guardar inventario inicial</button>

    .filter(([k])=>!q||nomT(k).toLowerCase().includes(q));

  return `
  <input placeholder="Buscar diseño, color o talla" value="${esc(tmp.busq||'')}"
    oninput="tmp.busq=this.value;pintarLista()" style="margin-bottom:8px">
  <div style="display:flex;border:1px solid #d4d4d8;border-radius:12px;overflow:hidden;margin-bottom:12px">
    ${[['DETAL','Detal'],['MAYOR','Por mayor'],['PACK','Pack x3']].map(([t,n])=>
      `<button class="b chico" style="flex:1;border-radius:0;width:auto;
        background:${tv===t?'#18181b':'#fff'};color:${tv===t?'#fff':'#71717a'}"

    ${lista.length?lista.map(([k,v])=>{

        <div><span class="punto" style="background:${color(c).hex}"></span>
          ${usaDis()?`<span class="tag">${esc(linea(lin).n)}</span>`:''}</div>
        <div style="font-weight:700;font-size:14px;margin-top:5px;line-height:1.2">${esc(usaDis()?diseno(d).n:linea(lin).n)}</div>
        <div style="font-size:12px;color:var(--suave)">${esc(color(c).n)} · Talla ${esc(talla(t).n)}</div>

      <div style="display:flex;align-items:center;gap:6px">
        <button class="b g chico" style="min-height:34px;padding:0 11px" onclick="A.cant('${l.k}',-1)">−</button>
        <b class="cifra" style="min-width:20px;text-align:center">${l.cant}</b>
        <button class="b g chico" style="min-height:34px;padding:0 11px" onclick="A.cant('${l.k}',1)">+</button>
      </div>
      <div class="m cifra" style="min-width:74px">${cop(l.neto)}</div>
    </div>`).join('')}

    ${tv==='PACK'&&Object.keys(tmp._pack||{}).length?`<div style="background:#fafafa;border-radius:12px;
      padding:8px 10px;font-size:12.5px;color:var(--suave);margin-top:6px">
      ${Object.values(tmp._pack).map(p=>
        `${esc(p.linea)}: <b>${p.packs} pack${p.packs===1?'':'s'} de ${p.und}</b> a ${cop(p.precioPack)}${

/* ── Cartera ────────────────────────────────────────────── */
function vCartera(){
  const h=hoy();
  const deb=S.facturas.filter(f=>f.saldo>0&&f.estado!=='ANULADA')
    .sort((a,b)=>(a.limite||'9999').localeCompare(b.limite||'9999'));
  const total=deb.reduce((s,f)=>s+f.saldo,0);
  const venc=deb.filter(f=>f.limite&&f.limite<h);
  return `
  <div class="g2" style="margin-bottom:12px">
    <div class="kpi"><div class="et">Total por cobrar</div><div class="v cifra">${cop(total)}</div>
      <div class="d">${deb.length} facturas</div></div>
    <div class="kpi"><div class="et">Vencido</div><div class="v cifra" style="color:var(--tinta)">${cop(venc.reduce((s,f)=>s+f.saldo,0))}</div>
      <div class="d">${venc.length} facturas</div></div>
  </div>
  <div class="card"><h3>Quién debe</h3>
    ${deb.length?deb.map(f=>{
      const vencida=f.limite&&f.limite<h;
      const dias=f.limite?Math.round((new Date(h)-new Date(f.limite))/864e5):null;
      return `<div class="item">
        <div><div class="t">${esc(cliente(f.cliente).n)}</div>
          <div class="s">${f.nro} · ${fecha(f.f)}${f.limite?' · vence '+fecha(f.limite):''}
            ${vencida?`<span class="tag rojo">${dias} días</span>`:''}</div>
          <button class="b n chico" style="margin-top:6px" onclick="A.abonar('${f._id}')">Registrar abono</button></div>
        <div class="m"><span class="cifra">${cop(f.saldo)}</span>
          <div class="s cifra">de ${cop(f.total)}</div></div></div>`}).join('')
      :'<div class="vacio">Nadie te debe. Todo cobrado.</div>'}
  </div>`;
}

/* ── Caja ───────────────────────────────────────────────── */
function vCaja(){
  const h=hoy();
  const hoyMov=S.caja.filter(m=>m.f===h);
  const ing=hoyMov.filter(m=>m.tipo==='INGRESO').reduce((s,m)=>s+m.monto,0);
  const egr=hoyMov.filter(m=>m.tipo==='EGRESO').reduce((s,m)=>s+m.monto,0);
  return `
  <div class="g2" style="margin-bottom:12px">
    <div class="kpi"><div class="et">Entró hoy</div><div class="v cifra" style="color:var(--ok)">${cop(ing)}</div></div>
    <div class="kpi"><div class="et">Salió hoy</div><div class="v cifra" style="color:var(--tinta)">${cop(egr)}</div></div>
  </div>

  <div class="card"><h3>Saldos</h3>
    ${S.cuentas.map(q=>`<div class="item"><div class="t">${esc(q.n)}</div>
      <div class="m cifra">${cop(q.saldo)}</div></div>`).join('')}
    <div class="item" style="border-top:1px solid var(--linea)"><div class="t">Total</div>
      <div class="m cifra">${cop(S.cuentas.reduce((s,q)=>s+q.saldo,0))}</div></div>
  </div>

  <div class="card"><h3>Registrar gasto</h3>
    <div class="g2">
      <div><label>Fecha</label><input type="date" id="gFecha" value="${hoy()}"></div>
      <div><label>Categoría</label><select id="gCat">${S.catGastos.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
    </div>
    <label>¿En qué fue?</label><input id="gDesc" placeholder="Ej: transfer DTF, domicilio, arriendo">
    <div class="g2">
      <div><label>Valor</label><input id="gMonto" inputmode="numeric" placeholder="0"></div>
      <div><label>Sale de</label><select id="gCuenta">${optCuenta()}</select></div>
    </div>
    <button class="b" style="margin-top:12px" onclick="A.guardarGasto()">Guardar gasto</button>
  </div>

  <div class="card"><h3>Movimientos</h3>
    ${S.caja.slice().reverse().slice(0,40).map(m=>`<div class="item">
      <div><div class="t">${esc(m.concepto)}</div>
        <div class="s">${fecha(m.f)} · ${esc(cuenta(m.cuenta).n)}</div></div>
      <div class="m cifra" style="color:${m.tipo==='INGRESO'?'var(--ok)':'var(--tinta)'}">
        ${m.tipo==='INGRESO'?'+':'−'}${cop(m.monto)}</div></div>`).join('')
      ||'<div class="vacio">Sin movimientos todavía.</div>'}
  </div>`;
}

/* ── Reportes ───────────────────────────────────────────── */
function vReportes(){
  const d=tmp.rDesde||hoy().slice(0,8)+'01', ha=tmp.rHasta||hoy();
  const fs=S.facturas.filter(f=>f.estado!=='ANULADA'&&f.f>=d&&f.f<=ha);
  const gs=S.gastos.filter(g=>g.f>=d&&g.f<=ha);
  const cs=S.compras.filter(c=>c.f>=d&&c.f<=ha);
  const os=S.ordenes.filter(o=>o.f>=d&&o.f<=ha);
  const venta=fs.reduce((s,f)=>s+f.total,0);
  const costo=fs.reduce((s,f)=>s+f.costo,0);
  const gasto=gs.reduce((s,g)=>s+g.monto,0);

  const porProd={}, porLinea={};
  fs.forEach(f=>f.det.forEach(x=>{
    const p=porProd[x.k]||(porProd[x.k]={u:0,v:0,c:0});
    p.u+=x.cant; p.v+=x.neto; p.c+=x.costo;
    const l=x.k.split('|')[1];
    const q=porLinea[l]||(porLinea[l]={u:0,v:0,c:0});
    q.u+=x.cant; q.v+=x.neto; q.c+=x.costo;
  }));

  return `
  <div class="card"><h3>Periodo</h3>
    <div class="g2">
      <div><label>Desde</label><input type="date" value="${d}" onchange="tmp.rDesde=this.value;pintar()"></div>
      <div><label>Hasta</label><input type="date" value="${ha}" onchange="tmp.rHasta=this.value;pintar()"></div>
    </div>
  </div>

  <div class="card"><h3>Estado de resultados</h3>
    <div class="item"><div class="t">Ventas</div><div class="m cifra">${cop(venta)}</div></div>
    <div class="item"><div class="t">Costo de la mercancía</div><div class="m cifra">−${cop(costo)}</div></div>
    <div class="item"><div class="t"><b>Utilidad bruta</b></div>
      <div class="m cifra"><b>${cop(venta-costo)}</b>
        <div class="s">${venta?((venta-costo)/venta*100).toFixed(1):0}% de margen</div></div></div>
    <div class="item"><div class="t">Gastos</div><div class="m cifra">−${cop(gasto)}</div></div>
    <div class="item"><div class="t"><b>Utilidad neta</b></div>
      <div class="m cifra" style="font-size:18px"><b>${cop(venta-costo-gasto)}</b></div></div>
  </div>

  <div class="card"><h3>Utilidad por línea</h3>
    <div class="scroll"><table>
      <tr><th>Línea</th><th class="n">Und</th><th class="n">Venta</th><th class="n">Utilidad</th><th class="n">%</th></tr>
      ${Object.entries(porLinea).map(([l,x])=>`<tr><td>${esc(linea(l).n)}</td>
        <td class="n">${x.u}</td><td class="n">${cop(x.v)}</td><td class="n">${cop(x.v-x.c)}</td>
        <td class="n">${x.v?((x.v-x.c)/x.v*100).toFixed(0):0}%</td></tr>`).join('')
        ||'<tr><td colspan="5" style="color:#999">Sin ventas en el periodo</td></tr>'}
    </table></div>
  </div>

  <div class="card"><h3>Utilidad por producto</h3>
    <div class="scroll"><table>
      <tr><th>Producto</th><th class="n">Und</th><th class="n">Venta</th><th class="n">Utilidad</th></tr>
      ${Object.entries(porProd).sort((a,b)=>(b[1].v-b[1].c)-(a[1].v-a[1].c)).map(([k,x])=>
        `<tr><td>${esc(nomT(k))}</td><td class="n">${x.u}</td>
         <td class="n">${cop(x.v)}</td><td class="n">${cop(x.v-x.c)}</td></tr>`).join('')
        ||'<tr><td colspan="4" style="color:#999">Sin ventas en el periodo</td></tr>'}
    </table></div>
    <button class="b g chico" style="margin-top:10px;width:100%" onclick="A.csv('utilidad-productos',
      [['Producto','Unidades','Venta','Costo','Utilidad']].concat(${JSON.stringify(
        Object.entries(porProd).map(([k,x])=>[nomT(k),x.u,Math.round(x.v),Math.round(x.c),Math.round(x.v-x.c)]))}))">
      Descargar Excel (CSV)</button>
  </div>

  <div class="card"><h3>Resumen del periodo</h3>
    <div class="item"><div class="t">Compras de lisas</div>
      <div class="m cifra">${cop(cs.reduce((s,c)=>s+c.total,0))}<div class="s">${cs.length} compras</div></div></div>
    <div class="item"><div class="t">Producción</div>
      <div class="m cifra">${num(os.reduce((s,o)=>s+o.buenas,0))} und
        <div class="s">${num(os.reduce((s,o)=>s+o.merma,0))} dañadas</div></div></div>
    <div class="item"><div class="t">Facturas emitidas</div><div class="m cifra">${fs.length}</div></div>
    <div class="item"><div class="t">Ticket promedio</div>
      <div class="m cifra">${cop(fs.length?venta/fs.length:0)}</div></div>
  </div>

  <div class="card"><h3>Libro diario</h3>
    <div class="scroll"><table>
      <tr><th>Fecha</th><th>Concepto</th><th>Cuenta</th><th class="n">Débito</th><th class="n">Crédito</th></tr>
      ${S.asientos.filter(a=>a.f>=d&&a.f<=ha).slice().reverse().slice(0,60).flatMap(a=>
        a.lineas.map((l,i)=>`<tr><td>${i===0?fecha(a.f):''}</td><td>${i===0?esc(a.concepto):''}</td>
        <td>${esc(l.cuenta)}</td><td class="n">${l.d?cop(l.d):''}</td>
        <td class="n">${l.c?cop(l.c):''}</td></tr>`)).join('')
        ||'<tr><td colspan="5" style="color:#999">Sin movimientos contables</td></tr>'}
    </table></div>
  </div>`;
}

/* ── Ajustes ────────────────────────────────────────────── */
function listaEdit(titulo,lista,campo){
  return `<div class="card"><h3>${titulo}</h3>
    ${S[lista].map((x,i)=>`<div class="item"><div class="t">${esc(x.n)}</div>
      <div class="m"><button class="b g chico" style="min-height:30px" onclick="A.delCat('${lista}',${i})">✕</button></div></div>`).join('')
      ||'<div class="vacio">Vacío</div>'}
    <div class="fila" style="margin-top:10px">
      <input id="${campo}" placeholder="Agregar nuevo">
      <button class="b n chico" style="flex:0 0 auto" onclick="A.addCat('${lista}','${campo}')">Agregar</button>
    </div></div>`;
}
function vAjustes(){
  return `
  <div class="card"><h3>Precios</h3>
    ${S.lineas.map((L,i)=>`
      <div style="padding:10px 0;border-bottom:1px solid #f4f4f5">
        <label>Nombre</label><input id="ln${i}" value="${esc(L.n)}">
        <div class="g3">
          <div><label>Detal</label><input id="lp${i}" inputmode="numeric" value="${L.precio}"></div>
          <div><label>Transfer c/u</label><input id="le${i}" inputmode="numeric" value="${L.estampado}"></div>
          <div><label>Margen mín %</label><input id="lm${i}" inputmode="numeric" value="${L.margenMin}"></div>
        </div>
        <label>Precio al por mayor según cantidad</label>
        <div class="g3">
          <div><input id="r${i}a" inputmode="numeric" value="${L.rangos[0].p}" placeholder="1-5"></div>
          <div><input id="r${i}b" inputmode="numeric" value="${L.rangos[1].p}" placeholder="6-20"></div>
          <div><input id="r${i}c" inputmode="numeric" value="${L.rangos[2].p}" placeholder="21+"></div>
        </div>
        <div style="font-size:11px;color:var(--suave);margin-top:4px">1 a 5 · 6 a 20 · 21 o más</div>
        <div class="g2">
          <div><label>Camisetas por pack</label><input id="pu${i}" inputmode="numeric" value="${L.pack.und}"></div>
          <div><label>Precio del pack</label><input id="pp${i}" inputmode="numeric" value="${L.pack.precio}"></div>
        </div>
        <div style="font-size:11px;color:var(--suave);margin-top:4px">
          Queda en ${cop(L.pack.precio/L.pack.und)} por camiseta</div>
      </div>`).join('')}
    <div class="g2" style="margin-top:10px">
      <div><label>Alerta de stock bajo</label><input id="stockMin" inputmode="numeric" value="${S.stockMin}"></div>
      <div><label>Nombre del negocio</label><input id="eNom" value="${esc(S.empresa.nombre)}"></div>
    </div>
    <div style="background:#fafafa;border-radius:12px;padding:12px;margin-top:12px">
      <label style="display:flex;align-items:center;gap:9px;text-transform:none;font-size:14px;
        letter-spacing:0;color:var(--texto);margin:0">
        <input type="checkbox" id="usaDis" style="width:auto;min-height:auto"${usaDis()?' checked':''}>
        <b>Controlar cada diseño por separado</b></label>
      <div style="font-size:12px;color:var(--suave);margin-top:6px">
        Apagado: solo manejas ${S.lineas.map(l=>esc(l.n)).join(' y ')} por color y talla.
        Encendido: el inventario se separa modelo por modelo. Con muchos diseños se vuelve difícil de contar.</div>
    </div>
    <div class="g2">
      <div><label>Teléfono</label><input id="eTel" value="${esc(S.empresa.tel)}"></div>
      <div><label>NIT</label><input id="eNit" value="${esc(S.empresa.nit)}"></div>
    </div>
    <button class="b" style="margin-top:12px" onclick="A.guardarPrecios()">Guardar</button>
  </div>

  ${listaEdit('Diseños','disenos','nDis')}
  ${listaEdit('Clientes','clientes','nCli')}
  ${listaEdit('Colores','colores','nCol')}
  ${listaEdit('Tallas','tallas','nTal')}
  ${listaEdit('Proveedores','proveedores','nProv')}
  ${listaEdit('Cuentas de dinero','cuentas','nCue')}

  <div class="card"><h3>Respaldo</h3>
    <p style="font-size:13px;color:var(--suave);margin:0 0 12px">
      Todo se guarda en este teléfono. Si borras el navegador o cambias de equipo, pierdes los datos.
      Descarga un respaldo cada semana y guárdalo en Drive o WhatsApp.</p>
    <button class="b n" onclick="A.exportar()">Descargar respaldo</button>
    <div style="font-size:12.5px;color:var(--suave);margin-top:12px;padding-top:12px;
      border-top:1px solid var(--linea)">
      Conectado como <b>${esc(yo.nombre)}</b> (${yo.rol==='ADMIN'?'administrador':'vendedor'}).
      Los datos están en Firebase, no en este teléfono.
    </div>
  </div>`;
}

/* ═══════════ PINTAR ═════════════════════════════════════ */
/* El vendedor no ve costos, utilidad, compras, reportes ni ajustes.
   Ojo: esto es para el día a día, no es una caja fuerte. Alguien con
   conocimientos técnicos podría ver los datos que le llegan al navegador.
   Si eso te preocupa, hay que separar los costos en otra colección.      */
const SOLO_ADMIN=['compras','reportes','ajustes','caja'];

function pintar(){
  if(!yo||!S) return;
  const visibles=TABS.filter(t=>admin()||!SOLO_ADMIN.includes(t.k));
  if(!visibles.find(t=>t.k===tab)) tab='inicio';
  $('nav').innerHTML=visibles.map(t=>
    `<button class="${tab===t.k?'on':''}" onclick="ir('${t.k}')"><span>${t.i}</span>${t.n}</button>`).join('');
  $('hsub').textContent=({inicio:'Resumen del negocio',vender:'Punto de venta',inventario:'Bodega',
    taller:'Estampado',compras:'Compras',facturas:'Ventas emitidas',cartera:'Quién debe',
    caja:'Dinero',reportes:'Números',ajustes:'Configuración'})[tab]||'';
  const cuerpo={inicio:vInicio,vender:vVender,inventario:vInventario,taller:vTaller,compras:vCompras,
    facturas:vFacturas,cartera:vCartera,caja:vCaja,reportes:vReportes,ajustes:vAjustes}[tab];
  $('vista').innerHTML=(msg?`<div class="aviso ${msg.tipo==='err'?'err':'ok'}">${esc(msg.texto)}</div>`:'')+cuerpo();
}

/* ═══════════ ENTRAR ═════════════════════════════════════ */
function pantallaLogin(error){
  $('login').style.display='flex';
  $('app').style.display='none';
  $('login').innerHTML=`<div style="width:100%;max-width:360px">
    <h1 style="color:#fff;font-size:30px;letter-spacing:-.02em;margin:0">EMMANUKIDS</h1>
    <p style="color:#a1a1aa;font-size:13px;margin:4px 0 24px">Compras · Taller · Ventas · Caja</p>
    <div style="background:#fff;border-radius:18px;padding:18px">
      <label>Correo</label><input id="lMail" type="email" autocomplete="username">
      <label>Contraseña</label><input id="lPass" type="password" autocomplete="current-password">
      ${error?`<div class="aviso err" style="margin:12px 0 0">${esc(error)}</div>`:''}
      <button class="b" style="margin-top:14px" id="lBtn">Entrar</button>
    </div></div>`;
  const entrar=async()=>{
    $('lBtn').disabled=true; $('lBtn').textContent='Entrando…';
    try{ await signInWithEmailAndPassword(auth,val('lMail').trim(),val('lPass')) }
    catch(e){ pantallaLogin(
      /password|credential|invalid/i.test(e.code||'')?'Correo o contraseña incorrectos':
      'No se pudo conectar. Revisa el internet.') }
  };
  $('lBtn').onclick=entrar;
  $('lPass').onkeydown=e=>{ if(e.key==='Enter') entrar() };
}

onAuthStateChanged(auth,async u=>{
  if(!u){ yo=null; S=null; return pantallaLogin() }
  let perfil={};
  try{ const p=await getDoc(doc(db,'usuarios',u.uid)); if(p.exists()) perfil=p.data() }catch(e){}
  yo={uid:u.uid,nombre:perfil.nombre||u.email.split('@')[0],rol:perfil.rol||'VENDEDOR'};
  $('login').style.display='none';
  $('app').style.display='block';
  $('quien').textContent=yo.nombre;
  try{ if(yo.rol==='ADMIN') await sembrar() }catch(e){}
  escuchar();
});

/* Los botones del HTML llaman estas funciones, así que van al ámbito global */
Object.assign(window,{A,ir,tmp,pintar,pintarLista,pintarSoloCosto});
</script>
</body>
